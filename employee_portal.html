<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الموظف المطورة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #dbeafe;
            --primary-dark: #1e40af;
            --success: #16a34a;
            --success-light: #dcfce7;
            --danger: #dc2626;
            --danger-light: #fee2e2;
            --warning: #ea580c;
            --info: #0891b2;
            --dark: #1e293b;
            --dark-light: #334155;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #e2e8f0;
            --sidebar-width: 300px;
            --border-radius: 12px;
            --transition: all 0.3s ease;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        
        /* --- القائمة الجانبية --- */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: var(--sidebar-width);
            height: 100%;
            background: white;
            box-shadow: var(--shadow-lg);
            z-index: 1001;
            transition: var(--transition);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .sidebar-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--gray-light);
        }
        
        .sidebar-header h2 {
            color: var(--primary);
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .close-sidebar {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: var(--transition);
        }
        
        .close-sidebar:hover {
            background-color: var(--gray-light);
            color: var(--dark);
        }
        
        .sidebar-user {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--light);
            border-radius: var(--border-radius);
        }
        
        .user-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 2.5rem;
            margin: 0 auto 15px;
            border: 4px solid var(--primary-light);
            box-shadow: var(--shadow);
        }
        
        #sidebar-name {
            color: var(--dark);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        #sidebar-username {
            color: var(--gray);
            font-size: 0.9rem;
            background: var(--gray-light);
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        
        .sidebar-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .sidebar-stat {
            background: var(--light);
            padding: 16px;
            border-radius: var(--border-radius);
            text-align: center;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .sidebar-stat:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        
        .sidebar-stat .fas {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--primary);
        }
        
        .sidebar-stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
        }
        
        .sidebar-stat-label {
            font-size: 0.85rem;
            color: var(--gray);
        }
        
        .sidebar-menu {
            list-style: none;
            flex-grow: 1;
            margin-bottom: 20px;
        }
        
        .sidebar-menu li {
            margin-bottom: 8px;
        }
        
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            color: var(--dark);
            text-decoration: none;
            border-radius: var(--border-radius);
            transition: var(--transition);
            font-weight: 600;
        }
        
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .sidebar-menu i {
            margin-left: 12px;
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--gray);
            padding-top: 20px;
            border-top: 1px solid var(--gray-light);
        }
        
        .logout-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--danger);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }
        
        .logout-btn:hover {
            background-color: var(--danger-light);
        }
        
        /* --- الحاوية الرئيسية --- */
        .portal-container {
            background-color: white;
            padding: 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--gray-light);
        }
        
        .header h2 {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.5rem;
        }
        
        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: var(--transition);
        }
        
        .menu-toggle:hover {
            background-color: var(--primary-light);
        }
        
        .user-greeting {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .avatar:hover {
            transform: scale(1.05);
        }
        
        #employeeName { 
            font-weight: 600;
            color: var(--dark);
        }
        
        .time-section {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 24px;
            border-radius: var(--border-radius);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        
        #time { 
            font-size: 2.5rem; 
            font-weight: 700; 
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        #date { 
            font-size: 1.1rem; 
            opacity: 0.9; 
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-box {
            background-color: white;
            padding: 20px 16px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        
        .stat-box:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        
        .stat-box i { 
            font-size: 2rem; 
            margin-bottom: 12px; 
            color: var(--primary); 
        }
        
        .stat-value { 
            font-size: 1.8rem; 
            font-weight: 700; 
            color: var(--dark); 
            margin-bottom: 4px;
        }
        
        .stat-label { 
            font-size: 0.9rem; 
            color: var(--gray); 
        }
        
        .form-container, .verification-section {
            background-color: var(--light);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        
        .form-group { 
            margin-bottom: 18px; 
            text-align: right; 
        }
        
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: var(--dark);
        }
        
        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--gray-light);
            border-radius: var(--border-radius);
            font-size: 1rem;
            text-align: right;
            font-family: 'Cairo', sans-serif;
            transition: var(--transition);
        }
        
        input:focus { 
            border-color: var(--primary); 
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        
        .button-group { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 16px;
        }
        
        button {
            padding: 14px 16px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover:not(:disabled) { 
            transform: translateY(-2px); 
            box-shadow: var(--shadow);
        }
        
        button:disabled { 
            background: var(--gray-light); 
            color: var(--gray);
            cursor: not-allowed; 
            opacity: 0.7; 
        }
        
        #checkInBtn { 
            background: var(--success); 
            color: white; 
        }
        
        #checkInBtn:hover:not(:disabled) {
            background: #15803d;
        }
        
        #checkOutBtn { 
            background: var(--danger); 
            color: white; 
        }
        
        #checkOutBtn:hover:not(:disabled) {
            background: #b91c1c;
        }
        
        .action-buttons { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-top: 16px; 
        }
        
        .action-btn { 
            background-color: white; 
            border: 1px solid var(--gray-light); 
            color: var(--dark); 
        }
        
        .action-btn:hover { 
            border-color: var(--primary); 
            color: var(--primary); 
            background-color: var(--primary-light);
        }
        
        #message-container {
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            z-index: 9999;
            max-width: 350px;
        }
        
        #message {
            font-weight: 600; 
            padding: 16px 20px; 
            border-radius: var(--border-radius);
            text-align: right; 
            box-shadow: var(--shadow-lg);
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .success { 
            background-color: var(--success-light); 
            color: #166534; 
            border-left: 4px solid var(--success);
        }
        
        .error { 
            background-color: var(--danger-light); 
            color: #991b1b; 
            border-left: 4px solid var(--danger);
        }
        
        #human-verification label { 
            font-weight: 700; 
            color: var(--dark);
            margin-bottom: 12px;
            display: block;
        }
        
        #math-question { 
            font-size: 1.5rem; 
            font-weight: bold; 
            margin: 12px 0; 
            color: var(--primary);
        }
        
        #main-form { 
            display: none; 
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* --- نافذة التقرير --- */
        .report-modal {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0, 0, 0, 0.6); 
            display: flex; 
            align-items: center; 
            justify-content: center;
            z-index: 1001; 
            opacity: 0; 
            visibility: hidden; 
            transition: var(--transition);
        }
        
        .report-modal.open { 
            opacity: 1; 
            visibility: visible; 
        }
        
        .report-modal-content {
            background: white; 
            width: 90%; 
            max-width: 500px; 
            border-radius: var(--border-radius);
            padding: 24px; 
            box-shadow: var(--shadow-lg);
            transform: translateY(20px); 
            transition: var(--transition);
        }
        
        .report-modal.open .report-modal-content { 
            transform: translateY(0); 
        }
        
        .report-modal-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            padding-bottom: 16px; 
            border-bottom: 1px solid var(--gray-light); 
        }
        
        .report-modal-header h2 { 
            color: var(--primary); 
            margin: 0; 
        }
        
        .close-report { 
            background: none; 
            border: none; 
            font-size: 1.5rem; 
            cursor: pointer; 
            color: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: var(--transition);
        }
        
        .close-report:hover {
            background-color: var(--gray-light);
            color: var(--dark);
        }
        
        .report-form textarea {
            width: 100%; 
            padding: 16px; 
            border: 1px solid var(--gray-light); 
            border-radius: var(--border-radius);
            font-family: 'Cairo', sans-serif; 
            font-size: 1rem; 
            min-height: 160px; 
            margin-bottom: 20px;
            resize: vertical;
            transition: var(--transition);
        }
        
        .report-form textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        
        .report-form button { 
            width: 100%; 
            background-color: var(--success); 
            color: white; 
        }
        
        .report-form button:hover {
            background-color: #15803d;
        }
        
        /* --- تصميم متجاوب --- */
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 85%;
            }
            
            body { 
                align-items: flex-start; 
                padding: 12px;
            }
            
            .portal-container { 
                padding: 20px; 
                margin-top: 0; 
            }
            
            #time { 
                font-size: 2rem; 
            }
            
            .stats-container, .button-group, .action-buttons { 
                grid-template-columns: 1fr; 
            }
            
            .header { 
                flex-direction: row; 
            }
            
            .header h2 {
                font-size: 1.3rem;
            }
            
            .user-greeting {
                flex-direction: column;
                gap: 8px;
            }
            
            #employeeName {
                font-size: 0.9rem;
            }
            
            .avatar {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            
            .sidebar-user {
                padding: 16px;
            }
            
            .user-avatar {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }
            
            .sidebar-stats {
                grid-template-columns: 1fr;
            }
            
            #message-container {
                right: 12px;
                bottom: 12px;
                left: 12px;
                max-width: none;
            }
        }
        
        @media (max-width: 480px) {
            .portal-container {
                padding: 16px;
            }
            
            .time-section {
                padding: 20px;
            }
            
            #time {
                font-size: 1.8rem;
            }
            
            .form-container, .verification-section {
                padding: 16px;
            }
            
            .sidebar {
                padding: 16px;
            }
            
            .report-modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>الملف الشخصي</h2>
            <button class="close-sidebar" id="close-sidebar"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="sidebar-user">
            <div class="user-avatar" id="sidebar-avatar"></div>
            <h3 id="sidebar-name"></h3>
            <p id="sidebar-username"></p>
        </div>
        
        <div class="sidebar-stats">
            <div class="sidebar-stat">
                <i class="fas fa-calendar-check"></i>
                <div class="sidebar-stat-value" id="sidebar-days">--</div>
                <div class="sidebar-stat-label">إجمالي الحضور</div>
            </div>
            <div class="sidebar-stat">
                <i class="fas fa-business-time"></i>
                <div class="sidebar-stat-value" id="sidebar-shift">--</div>
                <div class="sidebar-stat-label">وردية اليوم</div>
            </div>
        </div>
        
        <ul class="sidebar-menu">
            <li><a href="#" class="active"><i class="fas fa-home"></i> الرئيسية</a></li>
            <li><a href="#"><i class="fas fa-history"></i> سجل الحضور</a></li>
            <li><a href="#"><i class="fas fa-file-alt"></i> تقاريري</a></li>
            <li><a href="#"><i class="fas fa-user-cog"></i> الإعدادات</a></li>
        </ul>
        
        <div class="sidebar-footer">
             <a href="#" id="logout-btn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
        </div>
    </div>
    
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="report-modal" id="report-modal">
        <div class="report-modal-content">
            <div class="report-modal-header">
                <h2>التقرير اليومي</h2>
                <button class="close-report" id="close-report"><i class="fas fa-times"></i></button>
            </div>
            <form id="report-form">
                <textarea class="report-form-textarea" placeholder="اكتب تقريرك اليومي هنا..." required></textarea>
                <button type="submit"><i class="fas fa-check"></i> حفظ التقرير</button>
            </form>
        </div>
    </div>

    <div class="portal-container">
        <div id="message-container"><div id="message"></div></div>

        <div class="header">
            <button class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></button>
            <h2>بوابة الموظف</h2>
            <div class="user-greeting">
                <div id="employeeName">مرحباً بك</div>
                <div class="avatar" id="avatar-toggle"></div>
            </div>
        </div>
        
        <div class="time-section">
            <div id="time">00:00:00</div>
            <div id="date">...</div>
        </div>
        
        <div class="stats-container">
            <div class="stat-box">
                <i class="fas fa-calendar-check"></i>
                <div class="stat-value" id="daysWorked">--</div>
                <div class="stat-label">إجمالي أيام الحضور</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-info-circle"></i>
                <div class="stat-value" id="attendanceStatus" style="font-size: 1.2rem;">لم تسجل حضور</div>
                <div class="stat-label">حالة اليوم</div>
            </div>
        </div>

        <div id="human-verification" class="verification-section">
            <label>للتحقق، الرجاء حل العملية الحسابية:</label>
            <div id="math-question">5 + 3 = ?</div>
            <input type="number" id="math-answer" placeholder="أدخل الإجابة هنا">
            <button id="verify-btn" style="width:100%; margin-top: 10px; background-color: var(--primary); color: white;">تحقق</button>
        </div>

        <div id="main-form" style="display: none;">
            <div class="form-container">
                <div class="form-group">
                    <label for="employeeSymbolicName">الاسم الرمزي</label>
                    <input type="text" id="employeeSymbolicName" required>
                </div>
                <div class="form-group">
                    <label for="employeePassword">كلمة المرور</label>
                    <input type="password" id="employeePassword" required>
                </div>
                <div class="form-group">
                    <label for="dailyCode">الرمز اليومي</label>
                    <input type="text" id="dailyCode" required>
                </div>
            </div>
            
            <div class="button-group">
                <button id="checkInBtn"><i class="fas fa-sign-in-alt"></i> تسجيل حضور</button>
                <button id="checkOutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل انصراف</button>
            </div>
            
            <div class="action-buttons">
                <button id="editReportBtn" class="action-btn"><i class="fas fa-edit"></i> كتابة / تعديل التقرير</button>
                <button id="viewReportBtn" class="action-btn"><i class="fas fa-file-alt"></i> عرض التقارير</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp as initializeFirebaseApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // --- إعدادات Firebase (نفس إعدادات لوحة التحكم) ---
        const firebaseConfig = {
            apiKey: "AIzaSyA1VBBOZQOUwnHp8x487g7lkn14x6Sp-7g",
            authDomain: "stoke-c650a.firebaseapp.com",
            databaseURL: "https://stoke-c650a-default-rtdb.firebaseio.com",
            projectId: "stoke-c650a",
            storageBucket: "stoke-c650a.firebasestorage.app",
            messagingSenderId: "464151163343",
            appId: "1:464151163343:web:728a60e952e4943bc822ba",
            measurementId: "G-6C1X40RWHZ"
        };
        
        let db;
        try {
            const app = initializeFirebaseApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            document.body.innerHTML = `
                <div class="portal-container">
                    <div class="header">
                        <h2>بوابة الموظف</h2>
                    </div>
                    <div style="padding: 40px 20px; text-align: center; color: var(--danger);">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 20px;"></i>
                        <h3>خطأ في الاتصال</h3>
                        <p>لا يمكن الاتصال بقاعدة البيانات. يرجى التحقق من اتصال الإنترنت والمحاولة مرة أخرى.</p>
                    </div>
                </div>
            `;
            console.error(e);
        }

        // --- عناصر الواجهة ---
        const DOMElements = {
            time: document.getElementById('time'),
            date: document.getElementById('date'),
            employeeName: document.getElementById('employeeName'),
            daysWorked: document.getElementById('daysWorked'),
            attendanceStatus: document.getElementById('attendanceStatus'),
            mathQuestion: document.getElementById('math-question'),
            mathAnswer: document.getElementById('math-answer'),
            mainForm: document.getElementById('main-form'),
            nameInput: document.getElementById('employeeSymbolicName'),
            passwordInput: document.getElementById('employeePassword'),
            codeInput: document.getElementById('dailyCode'),
            message: document.getElementById('message'),
            checkInBtn: document.getElementById('checkInBtn'),
            checkOutBtn: document.getElementById('checkOutBtn'),
            editReportBtn: document.getElementById('editReportBtn'),
            viewReportBtn: document.getElementById('viewReportBtn'),
            humanVerification: document.getElementById('human-verification'),
            verifyBtn: document.getElementById('verify-btn'),
            menuToggle: document.getElementById('menu-toggle'),
            sidebar: document.getElementById('sidebar'),
            closeSidebar: document.getElementById('close-sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            avatarToggle: document.getElementById('avatar-toggle'),
            mainAvatar: document.querySelector('.avatar'),
            sidebarAvatar: document.getElementById('sidebar-avatar'),
            sidebarName: document.getElementById('sidebar-name'),
            sidebarUsername: document.getElementById('sidebar-username'),
            sidebarDays: document.getElementById('sidebar-days'),
            sidebarShift: document.getElementById('sidebar-shift'),
            reportModal: document.getElementById('report-modal'),
            closeReport: document.getElementById('close-report'),
            reportForm: document.getElementById('report-form'),
            reportTextarea: document.querySelector('.report-form-textarea'),
            logoutBtn: document.getElementById('logout-btn'),
        };

        // --- متغيرات الحالة ---
        let appState = {
            mathCorrectAnswer: 0,
            currentUser: null,
            dailyReport: "",
            isCheckedIn: false,
            isLoading: false,
            todayAttendance: null
        };
        
        const todayDateString = new Date().toISOString().split('T')[0];

        // --- دوال مساعدة ---
        async function hashPassword(password) {
            const data = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        const showMessage = (text, type) => {
            DOMElements.message.textContent = text;
            DOMElements.message.className = type;
            DOMElements.message.style.display = 'block';
            setTimeout(() => { DOMElements.message.style.display = 'none'; }, 4000);
        };
        
        const setLoading = (button, isLoading) => {
            if (isLoading) {
                button.innerHTML = `<span class="loading"></span> جاري المعالجة...`;
                button.disabled = true;
            } else {
                // استعادة النص الأصلي بناءً على الزر
                if (button.id === 'checkInBtn') {
                    button.innerHTML = `<i class="fas fa-sign-in-alt"></i> تسجيل حضور`;
                } else if (button.id === 'checkOutBtn') {
                    button.innerHTML = `<i class="fas fa-sign-out-alt"></i> تسجيل انصراف`;
                } else if (button.type === 'submit' && button.closest('#report-form')) {
                    button.innerHTML = `<i class="fas fa-check"></i> حفظ التقرير`;
                }
                button.disabled = false;
            }
        };

        // --- دوال الواجهة والتحديث ---
        const updateTime = () => {
            const now = new Date();
            DOMElements.time.textContent = now.toLocaleTimeString('en-GB');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            DOMElements.date.textContent = now.toLocaleDateString('ar-EG', options);
        };

        const generateMathQuestion = () => {
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            appState.mathCorrectAnswer = num1 + num2;
            DOMElements.mathQuestion.textContent = `${num1} + ${num2} = ?`;
            DOMElements.mathAnswer.value = '';
        };
        
        const updateUIForLogin = (employee, attendance) => {
            const initial = employee.name.charAt(0);
            DOMElements.employeeName.textContent = `مرحباً، ${employee.name}`;
            
            // تحديث القائمة الجانبية
            DOMElements.sidebarName.textContent = employee.name;
            DOMElements.sidebarUsername.textContent = employee.username;
            DOMElements.mainAvatar.textContent = initial;
            DOMElements.sidebarAvatar.textContent = initial;

            // تحديث حالة الأزرار والنموذج
            DOMElements.checkInBtn.disabled = true;
            DOMElements.checkOutBtn.disabled = false;
            DOMElements.editReportBtn.disabled = false;
            DOMElements.nameInput.disabled = true;
            DOMElements.passwordInput.disabled = true;
            DOMElements.codeInput.disabled = true;
            DOMElements.attendanceStatus.textContent = "تم تسجيل الحضور";
            DOMElements.attendanceStatus.style.color = "var(--success)";
            
            // إذا كان هناك تقرير، قم بتحديثه
            if (attendance && attendance.report) {
                appState.dailyReport = attendance.report;
            }
            
            appState.currentUser = employee;
            appState.isCheckedIn = true;
            appState.todayAttendance = attendance;
            
            // تحديث إحصائيات المستخدم
            updateUserStats(employee.id);
        };

        const updateUIForLogout = () => {
            DOMElements.employeeName.textContent = `مرحباً بك`;
            DOMElements.daysWorked.textContent = '--';
            DOMElements.attendanceStatus.textContent = "لم تسجل حضور";
            DOMElements.attendanceStatus.style.color = "var(--dark)";
            
            DOMElements.sidebarName.textContent = '';
            DOMElements.sidebarUsername.textContent = '';
            DOMElements.sidebarDays.textContent = '--';
            DOMElements.sidebarShift.textContent = '--';
            DOMElements.mainAvatar.textContent = '';
            DOMElements.sidebarAvatar.textContent = '';
            
            DOMElements.checkInBtn.disabled = false;
            DOMElements.checkOutBtn.disabled = true;
            DOMElements.editReportBtn.disabled = true;
            
            DOMElements.nameInput.disabled = false;
            DOMElements.passwordInput.disabled = false;
            DOMElements.codeInput.disabled = false;
            DOMElements.nameInput.value = '';
            DOMElements.passwordInput.value = '';
            DOMElements.codeInput.value = '';
            
            appState.currentUser = null;
            appState.isCheckedIn = false;
            appState.dailyReport = "";
            appState.todayAttendance = null;
            DOMElements.reportTextarea.value = "";
            
            generateMathQuestion();
            DOMElements.mainForm.style.display = 'none';
            DOMElements.humanVerification.style.display = 'block';
        };

        // --- دوال Firebase ---
        const updateUserStats = async (userId) => {
            try {
                // جلب عدد أيام الحضور
                const attendanceRef = collection(db, "attendance");
                const q = query(attendanceRef, where("employeeId", "==", userId));
                const querySnapshot = await getDocs(q);
                const daysCount = querySnapshot.size;
                
                DOMElements.daysWorked.textContent = daysCount;
                DOMElements.sidebarDays.textContent = daysCount;
                
                // جلب وردية اليوم
                const today = new Date();
                const dayOfWeek = today.getDay();
                const shifts = ["صباحية", "مسائية", "ليلية"];
                const shift = shifts[dayOfWeek % 3];
                DOMElements.sidebarShift.textContent = shift;
                
            } catch (error) {
                console.error("خطأ في جلب إحصائيات المستخدم:", error);
            }
        };

        const checkAttendance = async (employeeId) => {
            try {
                const docRef = doc(db, "attendance", `${employeeId}_${todayDateString}`);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    return docSnap.data();
                }
                return null;
            } catch (error) {
                console.error("خطأ في التحقق من الحضور:", error);
                return null;
            }
        };

        const verifyEmployee = async (symbolicName, password, dailyCode) => {
            try {
                // جلب الموظف بناءً على الاسم الرمزي
                const employeesRef = collection(db, "employees");
                const q = query(employeesRef, where("symbolicName", "==", symbolicName));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    return { success: false, message: "الاسم الرمزي غير صحيح" };
                }
                
                const employeeDoc = querySnapshot.docs[0];
                const employee = { id: employeeDoc.id, ...employeeDoc.data() };
                
                // التحقق من كلمة المرور
                const hashedPassword = await hashPassword(password);
                if (employee.password !== hashedPassword) {
                    return { success: false, message: "كلمة المرور غير صحيحة" };
                }
                
                // التحقق من الرمز اليومي
                if (employee.dailyCode !== dailyCode) {
                    return { success: false, message: "الرمز اليومي غير صحيح" };
                }
                
                return { success: true, employee };
            } catch (error) {
                console.error("خطأ في التحقق من بيانات الموظف:", error);
                return { success: false, message: "حدث خطأ أثناء التحقق" };
            }
        };

        const recordAttendance = async (type) => {
            if (!appState.currentUser) return;
            
            try {
                setLoading(type === 'checkin' ? DOMElements.checkInBtn : DOMElements.checkOutBtn, true);
                
                const now = new Date();
                const timeString = now.toLocaleTimeString('ar-EG');
                const dateString = now.toISOString().split('T')[0];
                const docId = `${appState.currentUser.id}_${dateString}`;
                
                const attendanceData = {
                    employeeId: appState.currentUser.id,
                    employeeName: appState.currentUser.name,
                    date: dateString,
                    report: appState.dailyReport
                };
                
                if (type === 'checkin') {
                    attendanceData.checkInTime = timeString;
                    attendanceData.checkInTimestamp = now;
                } else {
                    attendanceData.checkOutTime = timeString;
                    attendanceData.checkOutTimestamp = now;
                }
                
                await setDoc(doc(db, "attendance", docId), attendanceData, { merge: true });
                
                showMessage(`تم تسجيل ${type === 'checkin' ? 'الحضور' : 'الانصراف'} بنجاح`, 'success');
                
                if (type === 'checkin') {
                    updateUIForLogin(appState.currentUser, attendanceData);
                } else {
                    updateUIForLogout();
                }
                
            } catch (error) {
                console.error("خطأ في تسجيل الحضور:", error);
                showMessage("حدث خطأ أثناء التسجيل", 'error');
            } finally {
                setLoading(type === 'checkin' ? DOMElements.checkInBtn : DOMElements.checkOutBtn, false);
            }
        };

        const saveDailyReport = async () => {
            if (!appState.currentUser) return;
            
            try {
                setLoading(DOMElements.reportForm.querySelector('button'), true);
                
                const reportText = DOMElements.reportTextarea.value;
                appState.dailyReport = reportText;
                
                const docId = `${appState.currentUser.id}_${todayDateString}`;
                await updateDoc(doc(db, "attendance", docId), {
                    report: reportText
                });
                
                showMessage("تم حفظ التقرير بنجاح", 'success');
                setTimeout(() => {
                    DOMElements.reportModal.classList.remove('open');
                }, 1500);
                
            } catch (error) {
                console.error("خطأ في حفظ التقرير:", error);
                showMessage("حدث خطأ أثناء حفظ التقرير", 'error');
            } finally {
                setLoading(DOMElements.reportForm.querySelector('button'), false);
            }
        };

        // --- معالجات الأحداث ---
        DOMElements.verifyBtn.addEventListener('click', async () => {
            const userAnswer = parseInt(DOMElements.mathAnswer.value);
            
            if (isNaN(userAnswer)) {
                showMessage("يرجى إدخال إجابة صحيحة", 'error');
                return;
            }
            
            if (userAnswer !== appState.mathCorrectAnswer) {
                showMessage("الإجابة غير صحيحة، حاول مرة أخرى", 'error');
                generateMathQuestion();
                return;
            }
            
            // إذا كانت الإجابة صحيحة، إظهار النموذج الرئيسي
            DOMElements.humanVerification.style.display = 'none';
            DOMElements.mainForm.style.display = 'block';
        });

        DOMElements.checkInBtn.addEventListener('click', async () => {
            const symbolicName = DOMElements.nameInput.value.trim();
            const password = DOMElements.passwordInput.value.trim();
            const dailyCode = DOMElements.codeInput.value.trim();
            
            if (!symbolicName || !password || !dailyCode) {
                showMessage("يرجى ملء جميع الحقول", 'error');
                return;
            }
            
            const result = await verifyEmployee(symbolicName, password, dailyCode);
            
            if (!result.success) {
                showMessage(result.message, 'error');
                return;
            }
            
            // التحقق مما إذا كان قد سجل حضور بالفعل اليوم
            const todayAttendance = await checkAttendance(result.employee.id);
            
            if (todayAttendance && todayAttendance.checkInTime) {
                showMessage("لقد سجلت حضورك مسبقاً اليوم", 'error');
                updateUIForLogin(result.employee, todayAttendance);
                return;
            }
            
            await recordAttendance('checkin');
        });

        DOMElements.checkOutBtn.addEventListener('click', async () => {
            await recordAttendance('checkout');
        });

        DOMElements.editReportBtn.addEventListener('click', () => {
            DOMElements.reportTextarea.value = appState.dailyReport;
            DOMElements.reportModal.classList.add('open');
        });

        DOMElements.closeReport.addEventListener('click', () => {
            DOMElements.reportModal.classList.remove('open');
        });

        DOMElements.reportForm.addEventListener('submit', (e) => {
            e.preventDefault();
            saveDailyReport();
        });

        DOMElements.menuToggle.addEventListener('click', () => {
            DOMElements.sidebar.classList.add('open');
            DOMElements.sidebarOverlay.classList.add('open');
        });

        DOMElements.closeSidebar.addEventListener('click', () => {
            DOMElements.sidebar.classList.remove('open');
            DOMElements.sidebarOverlay.classList.remove('open');
        });

        DOMElements.sidebarOverlay.addEventListener('click', () => {
            DOMElements.sidebar.classList.remove('open');
            DOMElements.sidebarOverlay.classList.remove('open');
        });

        DOMElements.logoutBtn.addEventListener('click', (e) => {
            e.preventDefault();
            updateUIForLogout();
            DOMElements.sidebar.classList.remove('open');
            DOMElements.sidebarOverlay.classList.remove('open');
            showMessage("تم تسجيل الخروج بنجاح", 'success');
        });

        // --- تهيئة التطبيق ---
        updateTime();
        setInterval(updateTime, 1000);
        generateMathQuestion();
        
        // تعطيل أزرار الانصراف والتقرير في البداية
        DOMElements.checkOutBtn.disabled = true;
        DOMElements.editReportBtn.disabled = true;
        DOMElements.viewReportBtn.disabled = true;
        
        // إضافة تأثيرات للواجهة
        document.querySelectorAll('.stat-box, .sidebar-stat').forEach(box => {
            box.addEventListener('mouseenter', () => {
                box.style.transform = 'translateY(-5px)';
            });
            box.addEventListener('mouseleave', () => {
                box.style.transform = 'translateY(0)';
            });
        });
        
        // إضافة تأثيرات للأزرار
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                if (!btn.disabled) {
                    btn.style.transform = 'translateY(-2px)';
                }
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'translateY(0)';
            });
        });
        
        // إضافة تأثيرات لحقول الإدخال
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.transform = 'translateY(-2px)';
            });
            input.addEventListener('blur', () => {
                input.parentElement.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
