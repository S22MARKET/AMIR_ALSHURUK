<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المطورة - طلبات أمير الشروق</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="httpshttps://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0f2f5;
        }
        .status-pending { background-color: #ffc107; color: #000; }
        .status-completed { background-color: #28a745; color: #fff; }
        .price-input {
            width: 130px;
            padding: 6px 10px; border: 1px solid #ccc;
            border-radius: 6px; text-align: center; font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .price-input:focus { outline: none; border-color: #0d6efd; box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.25); }
        .loader {
            border: 8px solid #f3f3f3; border-radius: 50%;
            border-top: 8px solid #3498db;
            width: 60px; height: 60px;
            animation: spin 1.5s linear infinite;
        }
        .copy-btn {
            background: none; border: none; cursor: pointer;
            color: #9ca3af; transition: color 0.2s;
        }
        .copy-btn:hover { color: #1d4ed8; }
        .copy-btn .fa-check { color: #28a745; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- تحويل الجدول إلى بطاقات على الهواتف --- */
        @media (max-width: 992px) {
            .orders-table thead { display: none; }
            .orders-table, .orders-table tbody, .orders-table tr, .orders-table td {
                display: block; width: 100%;
            }
            .orders-table tr {
                margin-bottom: 1.5rem; border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.08);
                background-color: #fff; border: 1px solid #e5e7eb;
                overflow: hidden;
            }
            .orders-table td {
                display: flex; justify-content: space-between; align-items: center;
                padding: 12px 15px; text-align: left;
                border-bottom: 1px solid #f3f4f6;
            }
            /* تمييز رأس البطاقة */
            .orders-table td[data-label="العميل"] {
                background-color: #f9fafb;
                font-size: 1.1rem;
                font-weight: 800;
            }
            .orders-table td:last-child { border-bottom: none; }
            .orders-table td::before {
                content: attr(data-label);
                font-weight: 700; color: #374151;
                text-align: right; margin-left: 10px;
            }
            .orders-table td[data-label="إجراءات"] { justify-content: center; }
            .price-input { width: 140px; }
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-blue-700">لوحة التحكم المطورة</h1>
            <p class="text-gray-600 mt-2">عرض، بحث، وإدارة جميع الطلبات الواردة</p>
        </header>

        <div class="mb-6">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                    <i class="fas fa-search text-gray-400"></i>
                </span>
                <input type="text" id="searchInput" placeholder="ابحث بالاسم، الهاتف، أو المنتج..."
                       class="w-full py-3 pl-10 pr-4 text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition">
            </div>
        </div>

        <div id="loader" class="flex justify-center items-center h-64">
            <div class="loader"></div>
        </div>
        
        <div id="summary" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
             <div class="bg-white p-6 rounded-lg shadow-md flex items-center justify-between"><div><h2 class="text-lg font-semibold text-gray-500">إجمالي الطلبات</h2><p id="total-orders" class="text-3xl font-bold text-blue-600 mt-2">0</p></div><i class="fas fa-box-open text-4xl text-blue-200"></i></div>
             <div class="bg-white p-6 rounded-lg shadow-md flex items-center justify-between"><div><h2 class="text-lg font-semibold text-gray-500">مجموع الأسعار</h2><p id="total-price" class="text-3xl font-bold text-green-600 mt-2">0.00 د.ج</p></div><i class="fas fa-money-bill-wave text-4xl text-green-200"></i></div>
             <div class="bg-white p-6 rounded-lg shadow-md flex items-center justify-between"><div><h2 class="text-lg font-semibold text-gray-500">طلبات لم تتم</h2><p id="pending-orders" class="text-3xl font-bold text-yellow-500 mt-2">0</p></div><i class="fas fa-hourglass-half text-4xl text-yellow-200"></i></div>
             <div class="bg-white p-6 rounded-lg shadow-md flex items-center justify-between"><div><h2 class="text-lg font-semibold text-gray-500">إجمالي عمولتي</h2><p id="total-commission" class="text-3xl font-bold text-purple-600 mt-2">0.00 د.ج</p></div><i class="fas fa-hand-holding-usd text-4xl text-purple-200"></i></div>
        </div>

        <div id="orders-table-container" class="hidden bg-transparent rounded-lg">
            <table class="w-full text-right orders-table">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="p-4 font-semibold">العميل</th>
                        <th class="p-4 font-semibold">الهاتف</th>
                        <th class="p-4 font-semibold">العنوان</th>
                        <th class="p-4 font-semibold">المنتج</th>
                        <th class="p-4 font-semibold">الكمية</th>
                        <th class="p-4 font-semibold">السعر</th>
                        <th class="p-4 font-semibold">عمولتي</th>
                        <th class="p-4 font-semibold">المصدر</th>
                        <th class="p-4 font-semibold">الحالة</th>
                        <th class="p-4 font-semibold">التاريخ</th>
                        <th class="p-4 font-semibold">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="orders-body"></tbody>
            </table>
             <p id="no-results" class="hidden text-center text-gray-500 p-8">لا توجد نتائج مطابقة لبحثك.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA1VBBOZQOUwnHp8x487g7lkn14x6Sp-7g",
          authDomain: "stoke-c650a.firebaseapp.com",
          databaseURL: "https://stoke-c650a-default-rtdb.firebaseio.com",
          projectId: "stoke-c650a",
          storageBucket: "stoke-c650a.appspot.com",
          messagingSenderId: "464151163343",
          appId: "1:464151163343:web:c77c7dfd093ce9c1c822ba",
          measurementId: "G-EP0R97CYLS"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allOrders = []; // To store all orders for searching
        const ordersQuery = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        
        const ordersBody = document.getElementById('orders-body');
        const searchInput = document.getElementById('searchInput');
        const noResultsMsg = document.getElementById('no-results');
        const loader = document.getElementById('loader');
        const summary = document.getElementById('summary');
        const tableContainer = document.getElementById('orders-table-container');

        // --- Helper Functions ---
        function formatPhoneNumber(phone) {
            if (!phone) return 'غير متوفر';
            let cleaned = phone.toString().replace(/\D/g, ''); // Remove non-digit characters
            if (cleaned.startsWith('213')) {
                cleaned = cleaned.substring(3);
            } else if (cleaned.startsWith('0')) {
                cleaned = cleaned.substring(1);
            }
            if (cleaned.length === 9) {
                return `+213 ${cleaned.substring(0, 3)} ${cleaned.substring(3, 6)} ${cleaned.substring(6)}`;
            }
            return phone; // Return original if format is unexpected
        }

        function getSourceIcon(source) {
            const s = (source || 'website').toLowerCase();
            if (s.includes('whatsapp')) return '<i class="fab fa-whatsapp text-2xl text-green-500"></i>';
            if (s.includes('facebook')) return '<i class="fab fa-facebook text-2xl text-blue-700"></i>';
            if (s.includes('telegram')) return '<i class="fab fa-telegram text-2xl text-sky-500"></i>';
            if (s.includes('instagram')) return '<i class="fab fa-instagram text-2xl text-pink-500"></i>';
            return '<i class="fas fa-globe text-2xl text-gray-500"></i>';
        }

        function renderOrders(ordersToRender) {
            ordersBody.innerHTML = '';
            noResultsMsg.classList.add('hidden');

            if (ordersToRender.length === 0) {
                if (searchInput.value) { // Show message only if searching yields no results
                    noResultsMsg.classList.remove('hidden');
                } else { // Show default message if no orders at all
                     ordersBody.innerHTML = '<tr><td colspan="11" class="text-center p-8 text-gray-500">لا توجد طلبات حتى الآن.</td></tr>';
                }
                return;
            }

            ordersToRender.forEach(({ id, data: order }) => {
                const tr = document.createElement('tr');
                tr.className = 'border-b lg:bg-white';
                const statusClass = order.status === 'تمت الصفقة' ? 'status-completed' : 'status-pending';
                const date = order.createdAt ? order.createdAt.toDate().toLocaleDateString('ar-EG', { day: '2-digit', month: 'short', year: 'numeric'}) : 'غير محدد';
                const formattedPhone = formatPhoneNumber(order.customerPhone);

                tr.innerHTML = `
                    <td data-label="العميل">
                        <div class="flex items-center justify-between">
                            <span class="font-bold">${order.customerName}</span>
                            <button class="copy-btn mr-4" data-copy="${order.customerName}"><i class="far fa-copy"></i></button>
                        </div>
                    </td>
                    <td data-label="الهاتف">
                        <div class="flex items-center justify-between" dir="ltr">
                           <span>${formattedPhone}</span>
                           <button class="copy-btn ml-4" data-copy="${formattedPhone}"><i class="far fa-copy"></i></button>
                        </div>
                    </td>
                    <td data-label="العنوان">${order.customerLocation || 'غير محدد'}</td>
                    <td data-label="المنتج">${order.productName}</td>
                    <td data-label="الكمية" class="font-mono text-center text-lg">${order.quantity}</td>
                    <td data-label="السعر"><input type="number" value="${order.expectedPrice || 0}" class="price-input" data-id="${id}" data-field="expectedPrice" /></td>
                    <td data-label="عمولتي"><input type="number" value="${order.myCommission || 0}" class="price-input" data-id="${id}" data-field="myCommission" /></td>
                    <td data-label="المصدر" class="text-center">${getSourceIcon(order.source)}</td>
                    <td data-label="الحالة"><button class="status-toggle-btn w-full px-3 py-1 text-sm font-semibold rounded-full ${statusClass}" data-id="${id}" data-status="${order.status}">${order.status}</button></td>
                    <td data-label="التاريخ">${date}</td>
                    <td data-label="إجراءات"><button class="delete-btn text-red-500 hover:text-red-700 text-2xl" data-id="${id}"><i class="fas fa-trash-alt"></i></button></td>
                `;
                ordersBody.appendChild(tr);
            });
            addEventListenersToRows();
        }

        function updateSummary(orders) {
            let totalPrice = 0, pendingOrders = 0, totalCommission = 0;
            orders.forEach(({ data: order }) => {
                totalPrice += parseFloat(order.expectedPrice || 0);
                totalCommission += parseFloat(order.myCommission || 0);
                if (order.status !== 'تمت الصفقة') pendingOrders++;
            });
            document.getElementById('total-orders').textContent = orders.length;
            document.getElementById('total-price').textContent = `${totalPrice.toFixed(2)} د.ج`;
            document.getElementById('pending-orders').textContent = pendingOrders;
            document.getElementById('total-commission').textContent = `${totalCommission.toFixed(2)} د.ج`;
        }

        // Main listener
        onSnapshot(ordersQuery, (snapshot) => {
            loader.style.display = 'none';
            summary.classList.remove('hidden');
            tableContainer.classList.remove('hidden');
            
            allOrders = snapshot.docs.map(doc => ({ id: doc.id, data: doc.data() }));
            
            renderOrders(allOrders);
            updateSummary(allOrders);
        });

        // Search listener
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            const filteredOrders = allOrders.filter(({ data: order }) => 
                (order.customerName && order.customerName.toLowerCase().includes(searchTerm)) ||
                (order.customerPhone && order.customerPhone.toString().includes(searchTerm)) ||
                (order.productName && order.productName.toLowerCase().includes(searchTerm))
            );
            renderOrders(filteredOrders);
        });

        function addEventListenersToRows() {
            document.querySelectorAll('.status-toggle-btn').forEach(b => b.onclick = async (e) => {
                const id = e.target.dataset.id, newStatus = e.target.dataset.status === 'تمت الصفقة' ? 'مازال' : 'تمت الصفقة';
                await updateDoc(doc(db, 'orders', id), { status: newStatus });
            });
            document.querySelectorAll('.price-input').forEach(i => i.onchange = async (e) => {
                const id = e.target.dataset.id, field = e.target.dataset.field, newValue = parseFloat(e.target.value) || 0;
                await updateDoc(doc(db, 'orders', id), { [field]: newValue });
            });
            document.querySelectorAll('.delete-btn').forEach(b => b.onclick = async (e) => {
                const id = e.currentTarget.dataset.id;
                if (window.confirm('هل أنت متأكد من حذف هذا الطلب؟')) await deleteDoc(doc(db, 'orders', id));
            });
            document.querySelectorAll('.copy-btn').forEach(b => b.onclick = (e) => {
                const textToCopy = e.currentTarget.dataset.copy;
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const icon = e.currentTarget.querySelector('i');
                    icon.classList.remove('fa-copy');
                    icon.classList.add('fa-check');
                    setTimeout(() => {
                        icon.classList.remove('fa-check');
                        icon.classList.add('fa-copy');
                    }, 1500);
                });
            });
        }
    </script>
</body>
</html>
