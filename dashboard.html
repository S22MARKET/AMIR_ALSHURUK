<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الحضور (الإصدار النهائي فائق السرعة)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- General Styles & Variables --- */
        :root {
            --primary-color: #0d6efd; --primary-dark: #0a58ca; --primary-light: #e7f1ff;
            --bg-color: #f0f2f5; --card-bg: #ffffff; --text-color: #212529; --light-text: #6c757d;
            --border-color: #dee2e6; --shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
            --success-color: #198754; --danger-color: #dc3545; --warning-color: #ffc107; 
            --info-color: #0dcaf0;
        }
        body.dark-theme {
            --primary-color: #5887ff; --primary-dark: #3a52b1; --primary-light: #2a2f4c;
            --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --light-text: #888;
            --border-color: #333; --shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        *, *::before, *::after { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; min-height: 100vh; }
        .container { max-width: 1400px; margin: auto; padding-bottom: 30px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; padding-top: 15px; }
        header h1 { color: var(--primary-color); font-size: clamp(1.8em, 4vw, 2.5em); font-weight: 800; margin: 0; }
        .header-controls { display: flex; align-items: center; gap: 15px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .card-header { display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .card-header h2 { margin: 0; color: var(--primary-color); font-size: 1.6em; }
        .grid-container { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; font-weight: 700; color: #fff; transition: all 0.25s ease; font-family: 'Cairo', sans-serif; font-size: 0.95em; text-decoration: none; white-space: nowrap; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        .btn.primary { background-color: var(--primary-color); }
        .btn.success { background-color: var(--success-color); }
        .btn.danger { background-color: var(--danger-color); }
        .btn:disabled { background-color: var(--light-text); cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.7; }
        .btn-sm { padding: 5px 10px; font-size: 0.85em; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; font-size: 1em; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 14px; text-align: right; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        thead th { background-color: var(--primary-light); color: var(--primary-dark); font-size: 1.1em; text-align: right; }
        tbody tr:hover { background-color: color-mix(in srgb, var(--primary-color) 8%, transparent); }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85em; display: inline-block; min-width: 80px; text-align: center; }
        .status-present { background-color: color-mix(in srgb, var(--success-color) 20%, transparent); color: var(--success-color); }
        .status-absent { background-color: color-mix(in srgb, var(--danger-color) 20%, transparent); color: var(--danger-color); }
        .status-none { background-color: color-mix(in srgb, var(--light-text) 20%, transparent); color: var(--light-text); }
        .spinner { border: 4px solid var(--primary-light); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--primary-color); animation: spin 1s ease infinite; margin: 40px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stat-card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 20px; border-right: 5px solid; color: var(--primary-color); }
        .stat-card i { font-size: 2.5em; opacity: 0.7; }
        .stat-card .stat-value { font-size: 2em; font-weight: 800; display: block; }
        .stat-card.success { border-color: var(--success-color); color: var(--success-color); }
        .stat-card.danger { border-color: var(--danger-color); color: var(--danger-color); }
        .stat-card.info { border-color: var(--info-color); color: var(--info-color); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.7); align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 15px; }
        .modal-content { background-color: var(--card-bg); margin: auto; padding: 25px; width: 100%; max-width: 600px; border-radius: 16px; animation: slideDown 0.4s; position: relative; }
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-btn { color: #aaa; position: absolute; left: 20px; top: 15px; font-size: 28px; font-weight: bold; cursor: pointer; }
        #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 15px 20px; border-radius: 8px; color: #fff; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateY(100px); animation: slideUp 0.5s forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .toast.success { background-color: var(--success-color); }
        .toast.error { background-color: var(--danger-color); }
        .action-buttons button { margin: 0 4px; }
        /* --- Report & Controls Styles --- */
        .report-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .report-controls label { font-weight: 700; }
        #report-chart-container { max-height: 400px; margin-top: 20px; }
        /* --- Print Styles --- */
        @media print {
            body { padding: 0; margin: 0; }
            .card { box-shadow: none; border: 1px solid #ccc; }
            header, .header-controls, .stat-card, .action-buttons, #add-employee-btn, .report-controls, .no-print { display: none !important; }
            .container { max-width: 100%; }
            table { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>
    <div class="container" id="main-container">
        <header>
            <h1>نظام إدارة الحضور</h1>
            <div class="header-controls">
                <button id="add-employee-btn" class="btn primary"><i class="fas fa-user-plus"></i> <span>إضافة عامل</span></button>
                <button id="theme-toggle" class="btn outline" style="min-width: 45px;"><i class="fas fa-moon"></i></button>
            </div>
        </header>

         <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-tachometer-alt"></i> نظرة عامة لليوم (<span id="today-date-display"></span>)</h2>
            </div>
            <div id="overview-grid" class="grid-container">
                <div class="stat-card success"><i class="fas fa-user-check"></i><div><span class="stat-value" id="present-count">0</span><span class="stat-label">حاضر</span></div></div>
                <div class="stat-card danger"><i class="fas fa-user-times"></i><div><span class="stat-value" id="absent-count">0</span><span class="stat-label">غائب</span></div></div>
                <div class="stat-card info"><i class="fas fa-question-circle"></i><div><span class="stat-value" id="unmarked-count">0</span><span class="stat-label">لم يسجل</span></div></div>
                <div class="stat-card"><i class="fas fa-users"></i><div><span class="stat-value" id="total-employees-count">0</span><span class="stat-label">إجمالي العمال</span></div></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-users"></i> قائمة العمال وتسجيل الحضور</h2>
                <input type="text" id="search-input" placeholder="ابحث بالاسم أو رقم التعريف..." style="max-width: 300px;">
            </div>
            <div class="table-wrapper">
                <table id="employees-table">
                    <thead><tr><th>الاسم</th><th>رقم التعريف</th><th>حالة اليوم</th><th>تسجيل الحضور (سريع)</th><th>إجراءات</th></tr></thead>
                    <tbody id="employees-table-body"></tbody>
                </table>
            </div>
            <div id="loader-container" style="text-align: center; padding: 20px;"></div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-chart-pie"></i> تقارير الحضور</h2>
                 <div class="header-controls">
                    <button id="export-csv-btn" class="btn primary outline"><i class="fas fa-file-csv"></i> تصدير CSV</button>
                    <button id="print-report-btn" class="btn primary outline"><i class="fas fa-print"></i> طباعة</button>
                </div>
            </div>
            <div class="report-controls">
                <label for="report-start-date">من:</label>
                <input type="date" id="report-start-date">
                <label for="report-end-date">إلى:</label>
                <input type="date" id="report-end-date">
                <button id="generate-report-btn" class="btn primary"><i class="fas fa-cogs"></i> إنشاء التقرير</button>
            </div>
            <div id="report-results">
                 <div id="report-chart-container"><canvas id="attendance-chart"></canvas></div>
                 <div class="table-wrapper" style="margin-top: 20px;"><table id="report-table"></table></div>
            </div>
        </div>

        <div id="employee-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2 id="modal-title">إضافة عامل جديد</h2>
                <form id="employee-form">
                    <label for="modal-employee-name">اسم العامل</label>
                    <input type="text" id="modal-employee-name" required>
                    <br><br>
                    <label for="modal-employee-id">رقم الهاتف او بطاقة التعريف</label>
                    <input type="text" id="modal-employee-id">
                    <br><br>
                    <label for="modal-employee-notes">ملاحظات</label>
                    <textarea id="modal-employee-notes" rows="4"></textarea>
                    <button id="save-modal-btn" type="submit" class="btn primary" style="width:100%; margin-top:15px;"><i class="fas fa-save"></i> <span>حفظ</span></button>
                </form>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, onSnapshot, limit, startAfter, writeBatch, getDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    // --- Firebase Configuration ---
    const firebaseConfig = {
        apiKey: "AIzaSyA1VBBOZQOUwnHp8x487g7lkn14x6Sp-7g",
        authDomain: "stoke-c650a.firebaseapp.com",
        databaseURL: "https://stoke-c650a-default-rtdb.firebaseio.com",
        projectId: "stoke-c650a",
        storageBucket: "stoke-c650a.appspot.com",
        messagingSenderId: "464151163343",
        appId: "1:464151163343:web:728a60e952e4943bc822ba"
    };
    
    // --- Global State & App Initialization ---
    let db, attendanceChart;
    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
    } catch (e) {
        document.body.innerHTML = `<h1>خطأ في الاتصال بقاعدة البيانات: ${e.message}</h1>`;
        console.error("Firebase initialization failed!", e);
    }

    const state = {
        employees: new Map(),
        dailyAttendance: {},
        currentEditingId: null,
        lastVisibleEmployee: null,
        isLoading: false,
    };
    const EMPLOYEES_PER_PAGE = 50;
    const today = new Date();
    const todayDateString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

    // --- DOM Elements ---
    const DOMElements = {
        employeesTableBody: document.getElementById('employees-table-body'),
        loaderContainer: document.getElementById('loader-container'),
        employeeModal: document.getElementById('employee-modal'),
        employeeForm: document.getElementById('employee-form'),
        modalTitle: document.getElementById('modal-title'),
        modalEmployeeName: document.getElementById('modal-employee-name'),
        modalEmployeeId: document.getElementById('modal-employee-id'),
        modalEmployeeNotes: document.getElementById('modal-employee-notes'),
        addEmployeeBtn: document.getElementById('add-employee-btn'),
        themeToggleBtn: document.getElementById('theme-toggle'),
        searchInput: document.getElementById('search-input'),
        presentCount: document.getElementById('present-count'),
        absentCount: document.getElementById('absent-count'),
        unmarkedCount: document.getElementById('unmarked-count'),
        totalEmployeesCount: document.getElementById('total-employees-count'),
        todayDateDisplay: document.getElementById('today-date-display'),
        reportStartDate: document.getElementById('report-start-date'),
        reportEndDate: document.getElementById('report-end-date'),
        generateReportBtn: document.getElementById('generate-report-btn'),
        reportTable: document.getElementById('report-table'),
        exportCsvBtn: document.getElementById('export-csv-btn'),
        printReportBtn: document.getElementById('print-report-btn'),
        reportResults: document.getElementById('report-results'),
    };
    
    // --- Helper & Utility Functions ---
    const sanitizeHTML = str => {
        const temp = document.createElement('div');
        temp.textContent = str;
        return temp.innerHTML;
    };

    const showToast = (message, type = 'success') => {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-times-circle'}"></i> ${sanitizeHTML(message)}`;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    };

    // --- Firebase Service (API Layer) ---
    const firebaseService = {
        updateEmployee: (id, data) => updateDoc(doc(db, 'employees', id), data),
        addEmployee: (data) => addDoc(collection(db, 'employees'), { ...data, createdAt: new Date() }),
        deleteEmployee: (id) => deleteDoc(doc(db, 'employees', id)),
        setAttendance: (employeeId, status, dateStr) => {
            const attendanceRef = doc(db, 'attendance', dateStr);
            // Use dot notation for nested fields in an update
            return updateDoc(attendanceRef, { [`statuses.${employeeId}`]: status });
        },
        createDailyAttendanceDoc: (dateStr) => {
            const attendanceRef = doc(db, 'attendance', dateStr);
            return setDoc(attendanceRef, { statuses: {} }, { merge: true });
        }
    };
    
    // --- Core Logic ---

    // Employee Management
    const handleSaveEmployee = async (e) => {
        e.preventDefault();
        const name = DOMElements.modalEmployeeName.value.trim();
        if (!name) { return showToast('الرجاء إدخال اسم العامل.', 'error'); }
        
        const employeeData = {
            name: name,
            customId: DOMElements.modalEmployeeId.value.trim(),
            notes: DOMElements.modalEmployeeNotes.value.trim()
        };

        DOMElements.employeeModal.style.display = 'none';

        try {
            if (state.currentEditingId) {
                await firebaseService.updateEmployee(state.currentEditingId, employeeData);
                showToast('تم تحديث العامل بنجاح.');
            } else {
                await firebaseService.addEmployee(employeeData);
                showToast('تمت إضافة العامل بنجاح.');
            }
        } catch (err) {
            showToast('حدث خطأ أثناء الحفظ.', 'error');
            console.error(err);
        }
    };
    
    const openEditModal = (empId) => {
        const emp = state.employees.get(empId);
        if (!emp) return;
        
        state.currentEditingId = empId;
        DOMElements.modalTitle.textContent = 'تعديل بيانات العامل';
        DOMElements.modalEmployeeName.value = emp.name;
        DOMElements.modalEmployeeId.value = emp.customId || '';
        DOMElements.modalEmployeeNotes.value = emp.notes || '';
        DOMElements.employeeModal.style.display = 'flex';
    };
    
    const handleDeleteEmployee = async (empId, empName) => {
        if (!confirm(`هل أنت متأكد من حذف العامل "${empName}"؟ لا يمكن التراجع عن هذا الإجراء.`)) return;

        try {
            await firebaseService.deleteEmployee(empId);
            state.employees.delete(empId);
            const row = DOMElements.employeesTableBody.querySelector(`tr[data-id='${empId}']`);
            if(row) row.remove();
            updateDashboardStats();
            showToast('تم حذف العامل بنجاح.');
        } catch (err) {
            showToast('فشل حذف العامل.', 'error');
            console.error(err);
        }
    };
    
    // Attendance Management
    const handleAttendanceAction = async (empId, status) => {
        const row = DOMElements.employeesTableBody.querySelector(`tr[data-id='${empId}']`);
        if (!row) return;

        // Optimistic UI Update
        updateAttendanceUI(row, status);
        
        try {
            await firebaseService.setAttendance(empId, status, todayDateString);
        } catch (err) {
            // Revert UI on error
            updateAttendanceUI(row, state.dailyAttendance[empId] || 'none');
            showToast(`فشل تسجيل حضور ${status === 'present' ? 'حاضر' : 'غائب'}`, 'error');
            console.error(err);
        }
    };
    
    // --- Real-time Listeners & Data Loading ---
    
    const listenForEmployeeChanges = () => {
        const q = query(collection(db, 'employees'), orderBy('name'));
        onSnapshot(q, (snapshot) => {
            snapshot.docChanges().forEach((change) => {
                const empData = { id: change.doc.id, ...change.doc.data() };
                const row = DOMElements.employeesTableBody.querySelector(`tr[data-id='${empData.id}']`);
                
                if (change.type === "added") {
                    state.employees.set(empData.id, empData);
                    if(!row) addEmployeeRow(empData);
                }
                if (change.type === "modified") {
                    state.employees.set(empData.id, empData);
                    if(row) updateEmployeeRow(row, empData);
                }
                if (change.type === "removed") {
                    state.employees.delete(empData.id);
                    if(row) row.remove();
                }
            });
            updateDashboardStats();
        });
    };
    
    const listenForDailyAttendance = () => {
        const attendanceRef = doc(db, 'attendance', todayDateString);
        onSnapshot(attendanceRef, (docSnap) => {
            if (docSnap.exists()) {
                state.dailyAttendance = docSnap.data().statuses || {};
            } else {
                // If the document for today doesn't exist, create it.
                firebaseService.createDailyAttendanceDoc(todayDateString);
                state.dailyAttendance = {};
            }
            // Update all visible rows with the latest attendance data
            DOMElements.employeesTableBody.querySelectorAll('tr').forEach(row => {
                const empId = row.dataset.id;
                const status = state.dailyAttendance[empId] || 'none';
                updateAttendanceUI(row, status);
            });
            updateDashboardStats();
        });
    };
    
    // --- UI Rendering ---

    const addEmployeeRow = (emp) => {
        const row = document.createElement('tr');
        row.dataset.id = emp.id;
        row.innerHTML = createEmployeeRowHTML(emp);
        DOMElements.employeesTableBody.appendChild(row);
        
        // Add event listeners for the new row's buttons
        row.querySelector('.btn-present').addEventListener('click', () => handleAttendanceAction(emp.id, 'present'));
        row.querySelector('.btn-absent').addEventListener('click', () => handleAttendanceAction(emp.id, 'absent'));
        row.querySelector('.btn-edit').addEventListener('click', () => openEditModal(emp.id));
        row.querySelector('.btn-delete').addEventListener('click', () => handleDeleteEmployee(emp.id, emp.name));
    };

    const updateEmployeeRow = (row, emp) => {
        row.innerHTML = createEmployeeRowHTML(emp);
        // Re-attach event listeners after innerHTML overwrite
        row.querySelector('.btn-present').addEventListener('click', () => handleAttendanceAction(emp.id, 'present'));
        row.querySelector('.btn-absent').addEventListener('click', () => handleAttendanceAction(emp.id, 'absent'));
        row.querySelector('.btn-edit').addEventListener('click', () => openEditModal(emp.id));
        row.querySelector('.btn-delete').addEventListener('click', () => handleDeleteEmployee(emp.id, emp.name));
    };
    
    const createEmployeeRowHTML = (emp) => {
        const status = state.dailyAttendance[emp.id] || 'none';
        const statusText = { present: 'حاضر', absent: 'غائب', none: 'لم يسجل' }[status];
        
        return `
            <td>${sanitizeHTML(emp.name)}</td>
            <td>${sanitizeHTML(emp.customId || '-')}</td>
            <td><span class="status-badge status-${status}">${statusText}</span></td>
            <td class="action-buttons">
                <button class="btn btn-sm success btn-present">حاضر</button>
                <button class="btn btn-sm danger btn-absent">غائب</button>
            </td>
            <td class="action-buttons">
                <button class="btn btn-sm primary outline btn-edit"><i class="fas fa-edit"></i> تعديل</button>
                <button class="btn btn-sm danger outline btn-delete"><i class="fas fa-trash"></i> حذف</button>
            </td>
        `;
    };

    const updateAttendanceUI = (row, status) => {
        const statusBadge = row.querySelector('.status-badge');
        const presentBtn = row.querySelector('.btn-present');
        const absentBtn = row.querySelector('.btn-absent');
        
        statusBadge.className = `status-badge status-${status}`;
        statusBadge.textContent = { present: 'حاضر', absent: 'غائب', none: 'لم يسجل' }[status];
        
        presentBtn.disabled = status === 'present';
        absentBtn.disabled = status === 'absent';
    };

    const updateDashboardStats = () => {
        const present = Object.values(state.dailyAttendance).filter(s => s === 'present').length;
        const absent = Object.values(state.dailyAttendance).filter(s => s === 'absent').length;
        const total = state.employees.size;
        
        DOMElements.presentCount.textContent = present;
        DOMElements.absentCount.textContent = absent;
        DOMElements.totalEmployeesCount.textContent = total;
        DOMElements.unmarkedCount.textContent = total - (present + absent);
    };

    // --- Search Functionality ---
    const filterTable = () => {
        const query = DOMElements.searchInput.value.toLowerCase();
        DOMElements.employeesTableBody.querySelectorAll('tr').forEach(row => {
            const name = row.cells[0].textContent.toLowerCase();
            const id = row.cells[1].textContent.toLowerCase();
            row.style.display = (name.includes(query) || id.includes(query)) ? '' : 'none';
        });
    };

    // --- Report Generation ---
    const generateReport = async () => {
        const startDate = DOMElements.reportStartDate.value;
        const endDate = DOMElements.reportEndDate.value;
        if (!startDate || !endDate) {
            return showToast('الرجاء تحديد تاريخ البدء والانتهاء', 'error');
        }

        const reportBtn = DOMElements.generateReportBtn;
        reportBtn.disabled = true;
        reportBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ الإنشاء...';

        try {
            // Firestore query to get documents between dates
            const q = query(collection(db, 'attendance'), where('__name__', '>=', startDate), where('__name__', '<=', endDate));
            const querySnapshot = await getDocs(q);

            const reportData = new Map(); // empId -> {name, present, absent}
            state.employees.forEach(emp => {
                reportData.set(emp.id, { name: emp.name, customId: emp.customId, present: 0, absent: 0 });
            });

            const dailyTrends = { dates: [], present: [], absent: [] };

            querySnapshot.forEach(doc => {
                const date = doc.id;
                const statuses = doc.data().statuses || {};
                let dailyPresent = 0;
                let dailyAbsent = 0;

                for (const [empId, status] of Object.entries(statuses)) {
                    if (reportData.has(empId)) {
                        if (status === 'present') {
                            reportData.get(empId).present++;
                            dailyPresent++;
                        } else if (status === 'absent') {
                            reportData.get(empId).absent++;
                            dailyAbsent++;
                        }
                    }
                }
                dailyTrends.dates.push(date);
                dailyTrends.present.push(dailyPresent);
                dailyTrends.absent.push(dailyAbsent);
            });
            
            renderReportTable(reportData);
            renderReportChart(dailyTrends);
            DOMElements.reportResults.style.display = 'block';

        } catch (error) {
            console.error("Error generating report: ", error);
            showToast("خطأ في إنشاء التقرير", "error");
        } finally {
            reportBtn.disabled = false;
            reportBtn.innerHTML = '<i class="fas fa-cogs"></i> إنشاء التقرير';
        }
    };

    const renderReportTable = (data) => {
        let tableHTML = `<thead><tr><th>الاسم</th><th>رقم التعريف</th><th>أيام الحضور</th><th>أيام الغياب</th></tr></thead><tbody>`;
        data.forEach(emp => {
            tableHTML += `<tr><td>${sanitizeHTML(emp.name)}</td><td>${sanitizeHTML(emp.customId || '-')}</td><td>${emp.present}</td><td>${emp.absent}</td></tr>`;
        });
        tableHTML += `</tbody>`;
        DOMElements.reportTable.innerHTML = tableHTML;
    };

    const renderReportChart = (trends) => {
        const ctx = document.getElementById('attendance-chart').getContext('2d');
        if (attendanceChart) {
            attendanceChart.destroy();
        }
        attendanceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: trends.dates,
                datasets: [{
                    label: 'حاضر',
                    data: trends.present,
                    borderColor: 'var(--success-color)',
                    backgroundColor: 'color-mix(in srgb, var(--success-color) 20%, transparent)',
                    fill: true,
                    tension: 0.3
                }, {
                    label: 'غائب',
                    data: trends.absent,
                    borderColor: 'var(--danger-color)',
                    backgroundColor: 'color-mix(in srgb, var(--danger-color) 20%, transparent)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } }
            }
        });
    };
    
    // --- Export & Print ---
    const exportTableToCSV = () => {
        const table = document.getElementById('report-table');
        if (!table || !table.rows.length) {
            return showToast('لا توجد بيانات لتصديرها. الرجاء إنشاء تقرير أولاً.', 'error');
        }
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "الاسم,رقم التعريف,أيام الحضور,أيام الغياب\n"; // Headers

        const rows = table.querySelectorAll("tr");
        rows.forEach(row => {
            // Skip header row
            if(row.querySelector('th')) return;
            let rowData = [];
            row.querySelectorAll("td").forEach(cell => {
                rowData.push(cell.innerText);
            });
            csvContent += rowData.join(",") + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `report_${todayDateString}.csv`);
        document.body.appendChild(link);
        link.click();
        link.remove();
    };
    
    const printReport = () => {
        if (!DOMElements.reportTable.rows.length) {
            return showToast('لا توجد بيانات للطباعة. الرجاء إنشاء تقرير أولاً.', 'error');
        }
        window.print();
    };

    // --- Theme Toggling ---
    const toggleTheme = () => {
        document.body.classList.toggle('dark-theme');
        const isDark = document.body.classList.contains('dark-theme');
        localStorage.setItem('darkTheme', isDark);
        DOMElements.themeToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i>`;
    };

    // --- Event Listeners Setup ---
    function setupEventListeners() {
        // Modal
        DOMElements.employeeForm.addEventListener('submit', handleSaveEmployee);
        DOMElements.addEmployeeBtn.addEventListener('click', () => {
            state.currentEditingId = null;
            DOMElements.modalTitle.textContent = 'إضافة عامل جديد';
            DOMElements.employeeForm.reset();
            DOMElements.employeeModal.style.display = 'flex';
        });
        DOMElements.employeeModal.querySelector('.close-btn').addEventListener('click', () => DOMElements.employeeModal.style.display = 'none');
        
        // Search
        DOMElements.searchInput.addEventListener('keyup', filterTable);

        // Theme
        DOMElements.themeToggleBtn.addEventListener('click', toggleTheme);
        
        // Reports, Export, Print
        DOMElements.generateReportBtn.addEventListener('click', generateReport);
        DOMElements.exportCsvBtn.addEventListener('click', exportTableToCSV);
        DOMElements.printReportBtn.addEventListener('click', printReport);
    }
    
    // --- Initial App Load ---
    async function initApp() {
        DOMElements.todayDateDisplay.textContent = new Intl.DateTimeFormat('ar-SA-u-nu-latn', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(today);
        DOMElements.reportStartDate.value = today.toISOString().split('T')[0];
        DOMElements.reportEndDate.value = today.toISOString().split('T')[0];
        DOMElements.reportResults.style.display = 'none';

        if(localStorage.getItem('darkTheme') === 'true') {
            toggleTheme();
        }

        setupEventListeners();
        listenForEmployeeChanges();
        listenForDailyAttendance();
        
        // Hide loader as onSnapshot will populate the table
        DOMElements.loaderContainer.style.display = 'none';
    }

    if (db) {
        initApp();
    }
    
</script>
</body>
</html>
