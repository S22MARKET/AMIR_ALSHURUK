<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الحضور (الإصدار النهائي)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- المتغيرات والأنماط العامة --- */
        :root {
            --primary-color: #0d6efd; --primary-dark: #0a58ca; --primary-light: #e7f1ff;
            --bg-color: #f0f2f5; --card-bg: #ffffff; --text-color: #212529; --light-text: #6c757d;
            --border-color: #dee2e6; --shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
            --success-color: #198754; --danger-color: #dc3545; --warning-color: #ffc107; --info-color: #0dcaf0;
        }
        body.dark-theme {
            --primary-color: #5887ff; --primary-dark: #3a52b1; --primary-light: #2a2f4c;
            --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --light-text: #888;
            --border-color: #333; --shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        *, *::before, *::after { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; min-height: 100vh; line-height: 1.6; }
        .container { max-width: 1400px; margin: auto; padding-bottom: 30px; display: none; } /* Hidden by default */
        header { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 20px; padding-top: 10px; gap: 15px; }
        header h1 { color: var(--primary-color); font-size: clamp(2em, 5vw, 2.8em); font-weight: 800; margin: 0; }
        .header-controls { display: flex; align-items: center; gap: 10px; width: 100%; justify-content: flex-start; flex-wrap: wrap; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 25px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .card-header { display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .card-header h2 { margin: 0; color: var(--primary-color); font-size: clamp(1.4em, 4vw, 1.6em); }
        .grid-container { display: grid; gap: 15px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; color: #fff; transition: all 0.25s ease; font-family: 'Cairo', sans-serif; font-size: 0.95em; text-decoration: none; white-space: nowrap; border: 1px solid transparent; }
        .btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        .btn.primary { background-color: var(--primary-color); }
        .btn.primary.outline { background-color: transparent; border-color: var(--primary-color); color: var(--primary-color); }
        .btn.primary.outline:hover { background-color: var(--primary-color); color: #fff; }
        .btn.danger.outline { background-color: transparent; border-color: var(--danger-color); color: var(--danger-color); }
        .btn.danger.outline:hover { background-color: var(--danger-color); color: #fff; }
        /* --- ألوان أزرار الحضور والغياب المحسنة --- */
        .btn.success { background-color: var(--success-color); border-color: var(--success-color); }
        .btn.danger { background-color: var(--danger-color); border-color: var(--danger-color); }
        .btn.success:hover:not(:disabled) { background-color: color-mix(in srgb, var(--success-color) 80%, black); }
        .btn.danger:hover:not(:disabled) { background-color: color-mix(in srgb, var(--danger-color) 80%, black); }
        .btn:disabled { background-color: var(--light-text); cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.7; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; font-size: 1em; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 14px 12px; text-align: right; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        thead th { background-color: var(--primary-light); color: var(--primary-dark); font-size: 1.1em; }
        tbody tr:hover { background-color: color-mix(in srgb, var(--primary-color) 8%, transparent); }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85em; display: inline-block; min-width: 80px; text-align: center; }
        .status-present { background-color: color-mix(in srgb, var(--success-color) 20%, transparent); color: var(--success-color); }
        .status-absent { background-color: color-mix(in srgb, var(--danger-color) 20%, transparent); color: var(--danger-color); }
        .status-none { background-color: color-mix(in srgb, var(--light-text) 20%, transparent); color: var(--light-text); }
        .spinner { border: 4px solid var(--primary-light); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--primary-color); animation: spin 1s ease infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .stat-card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 20px; border-right: 5px solid; color: var(--primary-color); }
        .stat-card i { font-size: clamp(2em, 6vw, 2.5em); opacity: 0.7; }
        .stat-card .stat-value { font-size: clamp(1.8em, 5vw, 2em); font-weight: 800; display: block; }
        .stat-card.success { border-color: var(--success-color); color: var(--success-color); }
        .stat-card.danger { border-color: var(--danger-color); color: var(--danger-color); }
        .stat-card.info { border-color: var(--info-color); color: var(--info-color); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.7); align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 15px; animation: fadeIn 0.3s; }
        .modal-content { background-color: var(--card-bg); margin: auto; padding: 25px; width: 100%; max-width: 500px; border-radius: 16px; animation: slideDown 0.4s; position: relative; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { translateY(0); opacity: 1; } }
        .close-btn { color: #aaa; position: absolute; left: 20px; top: 15px; font-size: 28px; font-weight: bold; cursor: pointer; }
        #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 15px 20px; border-radius: 8px; color: #fff; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateY(100px); animation: slideUp 0.5s forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .toast.success { background-color: var(--success-color); }
        .toast.error { background-color: var(--danger-color); }
        .action-buttons { display: flex; gap: 8px; flex-wrap: nowrap; }
        .report-controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        #report-chart-container { max-height: 400px; margin-top: 20px; }
        .empty-state { text-align: center; padding: 40px; color: var(--light-text); }
        .empty-state i { font-size: 3em; margin-bottom: 10px; }

        /* --- شاشة كلمة المرور --- */
        #login-modal { display: flex; }
        #login-modal .modal-content { max-width: 400px; }
        #login-spinner { display: none; }
        
        /* --- تحسينات الشاشات الصغيرة --- */
        @media (min-width: 768px) {
            header { flex-direction: row; justify-content: space-between; align-items: center; }
            .header-controls { width: auto; }
        }
        @media (max-width: 600px) {
            .action-buttons { flex-direction: column; align-items: stretch; width: 120px; }
            .action-buttons .btn { width: 100%; }
        }
        @media print {
            body { padding: 0; margin: 0; background-color: #fff; color: #000; }
            .card { box-shadow: none; border: 1px solid #ccc; }
            header, .header-controls, .stat-card, .action-buttons, #add-employee-btn, .report-controls, .no-print { display: none !important; }
            .container { max-width: 100%; display: block !important; }
            table { min-width: 100%; font-size: 10pt; }
            th, td { padding: 8px; }
            #report-chart-container, #login-modal, #password-modal, #attendance-date-picker-container { display: none; } /* Hide chart and modals in print */
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2><i class="fas fa-lock"></i> تسجيل الدخول</h2>
            <form id="login-form">
                <div style="margin-bottom: 15px;">
                    <label for="password-input">كلمة المرور</label>
                    <input type="password" id="password-input" required>
                </div>
                <button type="submit" class="btn primary" style="width:100%;"><i class="fas fa-sign-in-alt"></i> دخول</button>
                <div id="login-spinner" class="spinner"></div>
            </form>
        </div>
    </div>
    
    <div id="password-modal" class="modal">
        <div class="modal-content">
             <span class="close-btn">&times;</span>
            <h2>تغيير كلمة المرور</h2>
            <form id="password-change-form">
                 <div style="margin-bottom: 15px;">
                    <label for="current-password">كلمة المرور الحالية</label>
                    <input type="password" id="current-password" required>
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="new-password">كلمة المرور الجديدة</label>
                    <input type="password" id="new-password" required>
                </div>
                <button type="submit" class="btn primary" style="width:100%;"><i class="fas fa-key"></i> حفظ كلمة المرور الجديدة</button>
            </form>
        </div>
    </div>

    <div class="container" id="main-container">
        <header>
            <h1><i class="fas fa-calendar-check" style="color: var(--primary-color);"></i> نظام الحضور</h1>
            <div class="header-controls no-print">
                <button id="add-employee-btn" class="btn primary"><i class="fas fa-user-plus"></i> <span>إضافة عامل</span></button>
                <button id="change-password-btn" class="btn primary outline"><i class="fas fa-key"></i> <span>تغيير كلمة المرور</span></button>
                <button id="theme-toggle" class="btn primary outline" style="min-width: 45px;"><i class="fas fa-moon"></i></button>
            </div>
        </header>

         <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-tachometer-alt"></i> نظرة عامة للتاريخ: <span id="selected-date-display"></span></h2>
            </div>
            <div id="overview-grid" class="grid-container">
                <div class="stat-card success"><i class="fas fa-user-check"></i><div><span class="stat-value" id="present-count">0</span><span class="stat-label">حاضر</span></div></div>
                <div class="stat-card danger"><i class="fas fa-user-times"></i><div><span class="stat-value" id="absent-count">0</span><span class="stat-label">غائب</span></div></div>
                <div class="stat-card info"><i class="fas fa-question-circle"></i><div><span class="stat-value" id="unmarked-count">0</span><span class="stat-label">لم يسجل</span></div></div>
                <div class="stat-card"><i class="fas fa-users"></i><div><span class="stat-value" id="total-employees-count">0</span><span class="stat-label">إجمالي العمال</span></div></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-users"></i> قائمة العمال وتسجيل الحضور</h2>
                <div id="attendance-date-picker-container" class="report-controls no-print">
                    <label for="attendance-date-picker">اختر التاريخ:</label>
                    <input type="date" id="attendance-date-picker" style="max-width: 200px;">
                </div>
            </div>
            <div style="padding-bottom: 20px;">
                 <input type="text" id="search-input" placeholder="ابحث بالاسم أو رقم التعريف...">
            </div>
            <div class="table-wrapper">
                <table id="employees-table">
                    <thead><tr><th>الاسم</th><th>رقم التعريف</th><th>الحالة</th><th class="no-print">تسجيل (سريع)</th><th class="no-print">إجراءات</th></tr></thead>
                    <tbody id="employees-table-body"></tbody>
                </table>
            </div>
             <div id="loader-container" style="text-align: center; padding: 20px; display:none;"><div class="spinner"></div></div>
             <div id="empty-state-container" style="display: none;"></div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-chart-pie"></i> تقارير الحضور</h2>
                 <div class="header-controls no-print">
                    <button id="export-csv-btn" class="btn primary outline"><i class="fas fa-file-csv"></i> تصدير CSV</button>
                    <button id="print-report-btn" class="btn primary outline"><i class="fas fa-print"></i> طباعة</button>
                </div>
            </div>
            <div class="report-controls no-print">
                <label for="report-start-date">من:</label>
                <input type="date" id="report-start-date">
                <label for="report-end-date">إلى:</label>
                <input type="date" id="report-end-date">
                <button id="generate-report-btn" class="btn primary"><i class="fas fa-cogs"></i> إنشاء التقرير</button>
            </div>
            <div id="report-results" style="display: none;">
                 <div id="report-chart-container"><canvas id="attendance-chart"></canvas></div>
                 <div class="table-wrapper" style="margin-top: 20px;"><table id="report-table"></table></div>
            </div>
        </div>

        <div id="employee-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2 id="modal-title">إضافة عامل جديد</h2>
                <form id="employee-form" novalidate>
                    <div style="margin-bottom: 15px;">
                        <label for="modal-employee-name">اسم العامل <span style="color:red">*</span></label>
                        <input type="text" id="modal-employee-name" required>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label for="modal-employee-id">رقم الهاتف او بطاقة التعريف</label>
                        <input type="text" id="modal-employee-id">
                    </div>
                     <div style="margin-bottom: 15px;">
                        <label for="modal-employee-notes">ملاحظات</label>
                        <textarea id="modal-employee-notes" rows="3"></textarea>
                    </div>
                    <button id="save-modal-btn" type="submit" class="btn primary" style="width:100%; margin-top:15px; padding: 12px;"><i class="fas fa-save"></i> <span>حفظ</span></button>
                </form>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, query, orderBy, onSnapshot, writeBatch, getDocs, where } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

    // --- Firebase Configuration ---
    const firebaseConfig = {
        apiKey: "AIzaSyA1VBBOZQOUwnHp8x487g7lkn14x6Sp-7g",
        authDomain: "stoke-c650a.firebaseapp.com",
        databaseURL: "https://stoke-c650a-default-rtdb.firebaseio.com",
        projectId: "stoke-c650a",
        storageBucket: "stoke-c650a.appspot.com",
        messagingSenderId: "464151163343",
        appId: "1:464151163343:web:728a60e952e4943bc822ba"
    };
    
    // --- تهيئة التطبيق والحالة العامة ---
    let db, attendanceChart;
    let unsubscribeAttendanceListener = null; // To detach old listeners
    const APP_PASSWORD_KEY = 'attendanceAppPassword';
    const DEFAULT_PASSWORD = 'SIDIKASI';

    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
    } catch (e) {
        document.body.innerHTML = `<div style="text-align:center; padding-top: 50px;"><h1>خطأ في الاتصال بقاعدة البيانات</h1><p>${e.message}</p></div>`;
        console.error("Firebase initialization failed!", e);
    }

    const today = new Date();
    const todayDateString = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    
    const state = {
        employees: new Map(),
        dailyAttendance: {},
        currentEditingId: null,
        isAuthenticated: false,
        selectedDateString: todayDateString,
    };
    

    // --- عناصر الواجهة الرسومية ---
    const DOMElements = {
        mainContainer: document.getElementById('main-container'),
        loginModal: document.getElementById('login-modal'),
        loginForm: document.getElementById('login-form'),
        passwordInput: document.getElementById('password-input'),
        loginSpinner: document.getElementById('login-spinner'),
        passwordModal: document.getElementById('password-modal'),
        changePasswordBtn: document.getElementById('change-password-btn'),
        passwordChangeForm: document.getElementById('password-change-form'),
        employeesTableBody: document.getElementById('employees-table-body'),
        loaderContainer: document.getElementById('loader-container'),
        emptyStateContainer: document.getElementById('empty-state-container'),
        employeeModal: document.getElementById('employee-modal'),
        employeeForm: document.getElementById('employee-form'),
        modalTitle: document.getElementById('modal-title'),
        saveModalBtn: document.getElementById('save-modal-btn'),
        addEmployeeBtn: document.getElementById('add-employee-btn'),
        themeToggleBtn: document.getElementById('theme-toggle'),
        searchInput: document.getElementById('search-input'),
        presentCount: document.getElementById('present-count'),
        absentCount: document.getElementById('absent-count'),
        unmarkedCount: document.getElementById('unmarked-count'),
        totalEmployeesCount: document.getElementById('total-employees-count'),
        selectedDateDisplay: document.getElementById('selected-date-display'),
        attendanceDatePicker: document.getElementById('attendance-date-picker'),
        reportStartDate: document.getElementById('report-start-date'),
        reportEndDate: document.getElementById('report-end-date'),
        generateReportBtn: document.getElementById('generate-report-btn'),
        reportTable: document.getElementById('report-table'),
        exportCsvBtn: document.getElementById('export-csv-btn'),
        printReportBtn: document.getElementById('print-report-btn'),
        reportResults: document.getElementById('report-results'),
    };
    
    // --- دوال مساعدة ---
    const sanitizeHTML = str => str ? str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';

    const showToast = (message, type = 'success') => {
        const icon = type === 'success' ? 'fa-check-circle' : 'fa-times-circle';
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${icon}"></i> ${sanitizeHTML(message)}`;
        document.getElementById('toast-container').appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    };
    
    const getStoredPassword = () => localStorage.getItem(APP_PASSWORD_KEY) || DEFAULT_PASSWORD;

    // --- خدمات Firebase ---
    const firebaseService = {
        updateEmployee: (id, data) => updateDoc(doc(db, 'employees', id), data),
        addEmployee: (data) => addDoc(collection(db, 'employees'), { ...data, createdAt: new Date() }),
        deleteEmployee: (id) => deleteDoc(doc(db, 'employees', id)),
        setAttendance: (employeeId, status, dateStr) => {
            const attendanceRef = doc(db, 'attendance', dateStr);
            return updateDoc(attendanceRef, { [`statuses.${employeeId}`]: status });
        },
        createDailyAttendanceDoc: (dateStr) => {
            const attendanceRef = doc(db, 'attendance', dateStr);
            return setDoc(attendanceRef, { statuses: {} }, { merge: true });
        }
    };
    
    // --- منطق التطبيق الأساسي ---
    const handleSaveEmployee = async (e) => {
        e.preventDefault();
        const name = DOMElements.employeeForm['modal-employee-name'].value.trim();
        if (!name) { return showToast('الرجاء إدخال اسم العامل.', 'error'); }
        
        const employeeData = {
            name: name,
            customId: DOMElements.employeeForm['modal-employee-id'].value.trim(),
            notes: DOMElements.employeeForm['modal-employee-notes'].value.trim()
        };

        const originalBtnText = DOMElements.saveModalBtn.innerHTML;
        DOMElements.saveModalBtn.disabled = true;
        DOMElements.saveModalBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        try {
            if (state.currentEditingId) {
                await firebaseService.updateEmployee(state.currentEditingId, employeeData);
                showToast('تم تحديث العامل بنجاح.');
            } else {
                await firebaseService.addEmployee(employeeData);
                showToast('تمت إضافة العامل بنجاح.');
            }
            DOMElements.employeeModal.style.display = 'none';
        } catch (err) {
            showToast('حدث خطأ أثناء الحفظ.', 'error');
            console.error(err);
        } finally {
            DOMElements.saveModalBtn.disabled = false;
            DOMElements.saveModalBtn.innerHTML = originalBtnText;
        }
    };
    
    const openEditModal = (empId) => {
        const emp = state.employees.get(empId);
        if (!emp) return;
        
        state.currentEditingId = empId;
        DOMElements.modalTitle.textContent = 'تعديل بيانات العامل';
        DOMElements.employeeForm['modal-employee-name'].value = emp.name;
        DOMElements.employeeForm['modal-employee-id'].value = emp.customId || '';
        DOMElements.employeeForm['modal-employee-notes'].value = emp.notes || '';
        DOMElements.employeeModal.style.display = 'flex';
    };
    
    const handleDeleteEmployee = async (empId, empName) => {
        if (!confirm(`هل أنت متأكد من حذف العامل "${empName}"؟ سيتم حذفه نهائياً.`)) return;
        try {
            await firebaseService.deleteEmployee(empId);
            showToast('تم حذف العامل.');
        } catch (err) {
            showToast('فشل حذف العامل.', 'error'); console.error(err);
        }
    };
    
    const handleAttendanceAction = async (empId, status) => {
        try {
            await firebaseService.setAttendance(empId, status, state.selectedDateString);
        } catch (err) {
            // If the doc doesn't exist, create it first, then set status
            if (err.code === 'not-found' || err.code === 'INVALID_ARGUMENT') {
                await firebaseService.createDailyAttendanceDoc(state.selectedDateString);
                await firebaseService.setAttendance(empId, status, state.selectedDateString);
            } else {
                showToast(`فشل تسجيل الحالة`, 'error'); console.error(err);
            }
        }
    };
    
    // --- الاستماع للتغييرات والتحميل ---
    const listenForEmployeeChanges = () => {
        const q = query(collection(db, 'employees'), orderBy('name'));
        onSnapshot(q, (snapshot) => {
            snapshot.docChanges().forEach((change) => {
                const empData = { id: change.doc.id, ...change.doc.data() };
                if (change.type === "added" || change.type === "modified") {
                    state.employees.set(empData.id, empData);
                } else if (change.type === "removed") {
                    state.employees.delete(empData.id);
                }
            });
            renderEmployees();
            updateStatsDisplay();
        }, (error) => {
            console.error("Error listening to employees: ", error);
            showToast("خطأ في الاتصال بقائمة العمال", "error");
        });
    };
    
    const listenForDailyAttendance = (dateString) => {
        if (unsubscribeAttendanceListener) {
            unsubscribeAttendanceListener();
        }
        const attendanceRef = doc(db, 'attendance', dateString);
        unsubscribeAttendanceListener = onSnapshot(attendanceRef, (docSnap) => {
            if (docSnap.exists()) {
                state.dailyAttendance = docSnap.data().statuses || {};
            } else {
                state.dailyAttendance = {};
            }
            renderEmployees(); 
            updateStatsDisplay();
        }, (error) => {
            console.error(`Error listening to attendance for ${dateString}: `, error);
            showToast("خطأ في الاتصال بسجل الحضور", "error");
        });
    };
    
    // --- عرض البيانات في الواجهة ---
    const renderEmployees = () => {
        DOMElements.employeesTableBody.innerHTML = '';
        if (state.employees.size === 0) {
            DOMElements.emptyStateContainer.innerHTML = `<div class="empty-state"><i class="fas fa-users-slash"></i><p>لم يتم إضافة أي عمال بعد. ابدأ بإضافة عامل جديد.</p></div>`;
            DOMElements.emptyStateContainer.style.display = 'block';
            return;
        }
        DOMElements.emptyStateContainer.style.display = 'none';

        const sortedEmployees = [...state.employees.values()].sort((a, b) => a.name.localeCompare(b.name, 'ar'));
        sortedEmployees.forEach(emp => {
            const row = document.createElement('tr');
            row.dataset.id = emp.id;
            row.innerHTML = createEmployeeRowHTML(emp);
            DOMElements.employeesTableBody.appendChild(row);
            
            row.querySelector('.btn-present').addEventListener('click', () => handleAttendanceAction(emp.id, 'present'));
            row.querySelector('.btn-absent').addEventListener('click', () => handleAttendanceAction(emp.id, 'absent'));
            row.querySelector('.btn-edit').addEventListener('click', () => openEditModal(emp.id));
            row.querySelector('.btn-delete').addEventListener('click', () => handleDeleteEmployee(emp.id, emp.name));
        });
        filterTable();
    };
    
    const createEmployeeRowHTML = (emp) => {
        const status = state.dailyAttendance[emp.id] || 'none';
        const statusText = { present: 'حاضر', absent: 'غائب', none: 'لم يسجل' }[status];
        
        return `
            <td data-label="الاسم">${sanitizeHTML(emp.name)}</td>
            <td data-label="رقم التعريف">${sanitizeHTML(emp.customId || '-')}</td>
            <td data-label="الحالة"><span class="status-badge status-${status}">${statusText}</span></td>
            <td data-label="تسجيل (سريع)" class="action-buttons no-print">
                <button class="btn btn-sm success btn-present" ${status === 'present' ? 'disabled' : ''}>حاضر</button>
                <button class="btn btn-sm danger btn-absent" ${status === 'absent' ? 'disabled' : ''}>غائب</button>
            </td>
            <td data-label="إجراءات" class="action-buttons no-print">
                <button class="btn btn-sm primary outline btn-edit"><i class="fas fa-edit"></i></button>
                <button class="btn btn-sm danger outline btn-delete"><i class="fas fa-trash"></i></button>
            </td>
        `;
    };

    const updateStatsDisplay = () => {
        const present = Object.values(state.dailyAttendance).filter(s => s === 'present').length;
        const absent = Object.values(state.dailyAttendance).filter(s => s === 'absent').length;
        const total = state.employees.size;
        
        DOMElements.presentCount.textContent = present;
        DOMElements.absentCount.textContent = absent;
        DOMElements.totalEmployeesCount.textContent = total;
        DOMElements.unmarkedCount.textContent = Math.max(0, total - (present + absent));
    };

    const updateDateDisplays = (dateString) => {
        const date = new Date(dateString + 'T00:00:00'); // Avoid timezone issues
        const formattedDate = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { dateStyle: 'full' }).format(date);
        DOMElements.selectedDateDisplay.textContent = formattedDate;
    };

    // --- وظائف البحث والتقارير ---
    const filterTable = () => {
        const query = DOMElements.searchInput.value.toLowerCase().trim();
        DOMElements.employeesTableBody.querySelectorAll('tr').forEach(row => {
            const name = row.cells[0].textContent.toLowerCase();
            const id = row.cells[1].textContent.toLowerCase();
            row.style.display = (name.includes(query) || id.includes(query)) ? '' : 'none';
        });
    };

    const generateReport = async () => {
        const startDate = DOMElements.reportStartDate.value;
        const endDate = DOMElements.reportEndDate.value;
        if (!startDate || !endDate || startDate > endDate) {
            return showToast('الرجاء تحديد نطاق تاريخ صحيح', 'error');
        }

        const btn = DOMElements.generateReportBtn;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ الإنشاء...';

        try {
            const q = query(collection(db, 'attendance'), where('__name__', '>=', startDate), where('__name__', '<=', endDate));
            const querySnapshot = await getDocs(q);

            const reportData = new Map();
            state.employees.forEach(emp => {
                reportData.set(emp.id, { name: emp.name, customId: emp.customId, present: 0, absent: 0 });
            });

            const dailyTrends = { dates: [], present: [], absent: [] };

            querySnapshot.docs.sort((a,b) => a.id.localeCompare(b.id)).forEach(doc => {
                const date = doc.id;
                const statuses = doc.data().statuses || {};
                let dailyPresent = 0, dailyAbsent = 0;

                for (const [empId, status] of Object.entries(statuses)) {
                    if (reportData.has(empId)) {
                        if (status === 'present') { reportData.get(empId).present++; dailyPresent++; }
                        else if (status === 'absent') { reportData.get(empId).absent++; dailyAbsent++; }
                    }
                }
                dailyTrends.dates.push(date);
                dailyTrends.present.push(dailyPresent);
                dailyTrends.absent.push(dailyAbsent);
            });
            
            renderReportTable(reportData);
            renderReportChart(dailyTrends);
            DOMElements.reportResults.style.display = 'block';
            showToast('تم إنشاء التقرير بنجاح');

        } catch (error) {
            console.error("Error generating report: ", error);
            showToast("خطأ في إنشاء التقرير", "error");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-cogs"></i> إنشاء التقرير';
        }
    };
    
    const renderReportTable = (data) => {
        let tableHTML = `<thead><tr><th>Name</th><th>ID</th><th>Present Days</th><th>Absent Days</th></tr></thead><tbody>`;
        if (data.size === 0) {
            tableHTML += `<tr><td colspan="4" style="text-align:center;">لا توجد بيانات لعرضها.</td></tr>`;
        } else {
            [...data.values()].sort((a, b) => a.name.localeCompare(b.name, 'ar')).forEach(emp => {
                tableHTML += `<tr><td>${sanitizeHTML(emp.name)}</td><td>${sanitizeHTML(emp.customId || '-')}</td><td>${emp.present}</td><td>${emp.absent}</td></tr>`;
            });
        }
        DOMElements.reportTable.innerHTML = tableHTML + `</tbody>`;
    };

    const renderReportChart = (trends) => {
        const ctx = document.getElementById('attendance-chart').getContext('2d');
        if (attendanceChart) attendanceChart.destroy();
        const bodyStyles = window.getComputedStyle(document.body);
        attendanceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: trends.dates,
                datasets: [{
                    label: 'حاضر', data: trends.present, borderColor: bodyStyles.getPropertyValue('--success-color'),
                    backgroundColor: 'color-mix(in srgb, var(--success-color) 20%, transparent)', fill: true, tension: 0.3
                }, {
                    label: 'غائب', data: trends.absent, borderColor: bodyStyles.getPropertyValue('--danger-color'),
                    backgroundColor: 'color-mix(in srgb, var(--danger-color) 20%, transparent)', fill: true, tension: 0.3
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, suggestedMax: 10 } } }
        });
    };
    
    const exportTableToCSV = () => {
        const table = document.getElementById('report-table');
        if (!table || table.tHead.rows.length === 0 || table.tBodies[0].rows.length === 0) {
            return showToast('لا توجد بيانات لتصديرها. الرجاء إنشاء تقرير أولاً.', 'error');
        }

        let csvContent = "Name,ID,Present_Days,Absent_Days\n";

        for (const row of table.tBodies[0].rows) {
            let rowData = [];
            for(const cell of row.cells) {
                rowData.push(`"${cell.innerText.replace(/"/g, '""')}"`);
            }
            csvContent += rowData.join(",") + "\n";
        }
        
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `attendance_report.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };
    
    const printReport = () => {
        if (!document.getElementById('report-table') || document.getElementById('report-table').rows.length <= 1) {
             return showToast('لا توجد بيانات للطباعة. الرجاء إنشاء تقرير أولاً.', 'error');
        }
        window.print();
    };

    // --- وظائف المصادقة ---
    const handleLogin = (e) => {
        e.preventDefault();
        const enteredPassword = DOMElements.passwordInput.value;
        const correctPassword = getStoredPassword();

        DOMElements.loginSpinner.style.display = 'block';
        DOMElements.loginForm.querySelector('button').style.display = 'none';

        setTimeout(() => {
            if (enteredPassword === correctPassword) {
                state.isAuthenticated = true;
                DOMElements.loginModal.style.display = 'none';
                initApp();
            } else {
                showToast('كلمة المرور غير صحيحة!', 'error');
                DOMElements.passwordInput.value = '';
                DOMElements.loginSpinner.style.display = 'none';
                DOMElements.loginForm.querySelector('button').style.display = 'block';
            }
        }, 500);
    };

    const handleChangePassword = (e) => {
        e.preventDefault();
        const currentPassword = e.target['current-password'].value;
        const newPassword = e.target['new-password'].value;
        
        if (currentPassword !== getStoredPassword()) {
            return showToast('كلمة المرور الحالية غير صحيحة.', 'error');
        }
        if (!newPassword || newPassword.length < 4) {
             return showToast('كلمة المرور الجديدة يجب أن تكون 4 أحرف على الأقل.', 'error');
        }

        localStorage.setItem(APP_PASSWORD_KEY, newPassword);
        showToast('تم تغيير كلمة المرور بنجاح.', 'success');
        DOMElements.passwordChangeForm.reset();
        DOMElements.passwordModal.style.display = 'none';
    };

    // --- إعدادات التهيئة الأولية ---
    const setupEventListeners = () => {
        DOMElements.employeeForm.addEventListener('submit', handleSaveEmployee);
        DOMElements.addEmployeeBtn.addEventListener('click', () => {
            state.currentEditingId = null;
            DOMElements.modalTitle.textContent = 'إضافة عامل جديد';
            DOMElements.employeeForm.reset();
            DOMElements.employeeModal.style.display = 'flex';
        });
        DOMElements.employeeModal.querySelector('.close-btn').addEventListener('click', () => DOMElements.employeeModal.style.display = 'none');
        DOMElements.searchInput.addEventListener('input', filterTable);
        DOMElements.themeToggleBtn.addEventListener('click', toggleTheme);
        DOMElements.generateReportBtn.addEventListener('click', generateReport);
        DOMElements.exportCsvBtn.addEventListener('click', exportTableToCSV);
        DOMElements.printReportBtn.addEventListener('click', printReport);
        
        DOMElements.changePasswordBtn.addEventListener('click', () => {
            DOMElements.passwordChangeForm.reset();
            DOMElements.passwordModal.style.display = 'flex';
        });
        DOMElements.passwordModal.querySelector('.close-btn').addEventListener('click', () => DOMElements.passwordModal.style.display = 'none');
        DOMElements.passwordChangeForm.addEventListener('submit', handleChangePassword);

        DOMElements.attendanceDatePicker.addEventListener('change', (e) => {
            const newDate = e.target.value;
            if (newDate) {
                state.selectedDateString = newDate;
                updateDateDisplays(newDate);
                listenForDailyAttendance(newDate);
            }
        });
    };

    const toggleTheme = () => {
        document.body.classList.toggle('dark-theme');
        const isDark = document.body.classList.contains('dark-theme');
        localStorage.setItem('darkTheme', isDark);
        DOMElements.themeToggleBtn.innerHTML = `<i class="fas ${isDark ? 'fa-sun' : 'fa-moon'}"></i>`;
        if (attendanceChart) {
             renderReportChart(attendanceChart.data);
        }
    };
    
    const initApp = () => {
        if (!state.isAuthenticated) return;
        DOMElements.mainContainer.style.display = 'block';
        DOMElements.loaderContainer.style.display = 'block';

        DOMElements.attendanceDatePicker.value = state.selectedDateString;
        updateDateDisplays(state.selectedDateString);

        DOMElements.reportStartDate.value = todayDateString;
        DOMElements.reportEndDate.value = todayDateString;

        if (localStorage.getItem('darkTheme') === 'true') {
             document.body.classList.add('dark-theme');
             DOMElements.themeToggleBtn.innerHTML = `<i class="fas fa-sun"></i>`;
        }
        
        setupEventListeners();
        listenForEmployeeChanges();
        listenForDailyAttendance(state.selectedDateString);
        
        DOMElements.loaderContainer.style.display = 'none';
    };

    // --- بدء تشغيل التطبيق ---
    DOMElements.loginForm.addEventListener('submit', handleLogin);
    
</script>
</body>
</html>
