<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الحضور فائق السرعة</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* نفس الـ CSS من الإصدار السابق، لا حاجة لتغييره */
        :root {
            --primary-color: #0d6efd; --primary-dark: #0a58ca; --primary-light: #e7f1ff;
            --bg-color: #f0f2f5; --card-bg: #ffffff; --text-color: #212529; --light-text: #6c757d;
            --border-color: #dee2e6; --shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
            --success-color: #198754; --danger-color: #dc3545; --warning-color: #ffc107; 
            --info-color: #0dcaf0; --share-color: #6f42c1; --notes-color: #6c757d;
        }
        body.dark-theme {
            --primary-color: #5887ff; --primary-dark: #3a52b1; --primary-light: #2a2f4c;
            --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #e0e0e0; --light-text: #888;
            --border-color: #333; --shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            --success-color: #4CAF50; --danger-color: #f44336; --warning-color: #FF9800; 
            --info-color: #00BCD4; --share-color: #9b59b6; --notes-color: #9e9e9e;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; min-height: 100vh; }
        .container { max-width: 1400px; margin: auto; padding-bottom: 30px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .card-header { display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .card-header h2 { margin: 0; color: var(--primary-color); font-size: 1.6em; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; font-weight: 700; color: #fff; transition: all 0.25s ease; font-family: 'Cairo', sans-serif; font-size: 0.95em; text-decoration: none; white-space: nowrap; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }
        .btn.primary { background-color: var(--primary-color); } .btn.success { background-color: var(--success-color); } .btn.danger { background-color: var(--danger-color); }
        .btn.outline { background-color: transparent; color: var(--primary-color); border-color: var(--primary-color); }
        .btn.outline:hover { background-color: var(--primary-color); color: var(--card-bg); }
        .btn:disabled { background-color: var(--light-text); cursor: not-allowed; opacity: 0.7; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; font-size: 1em; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary-color) 25%, transparent); }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 14px; text-align: center; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        thead th { background-color: var(--primary-light); color: var(--primary-dark); font-size: 1.1em; }
        body.dark-theme thead th { color: var(--primary-color); }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85em; }
        .status-present { background-color: color-mix(in srgb, var(--success-color) 20%, transparent); color: var(--success-color); }
        .status-absent { background-color: color-mix(in srgb, var(--danger-color) 20%, transparent); color: var(--danger-color); }
        .status-none { background-color: color-mix(in srgb, var(--notes-color) 20%, transparent); color: var(--notes-color); }
        .spinner { border: 4px solid var(--primary-light); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--primary-color); animation: spin 1s ease infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .no-data { text-align: center; padding: 30px; color: var(--light-text); font-size: 1.1em; }
        .stat-card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 20px; border-left: 5px solid; }
        .stat-card i { font-size: 2.5em; opacity: 0.7; }
        .stat-card .stat-value { font-size: 2em; font-weight: 800; display: block; }
        .stat-card .stat-label { font-size: 1em; color: var(--light-text); }
        .stat-card.success { border-color: var(--success-color); color: var(--success-color); }
        .stat-card.danger { border-color: var(--danger-color); color: var(--danger-color); }
        .stat-card.info { border-color: var(--info-color); color: var(--info-color); }
        .stat-card.primary { border-color: var(--primary-color); color: var(--primary-color); }
        .grid-container { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        /* Add other styles from previous version here */
    </style>
</head>
<body>

    <div id="toast-container"></div>
    <div class="container" id="main-container">
        <header>
             <h1>نظام إدارة الحضور فائق السرعة</h1>
             <p>تحميل تدريجي للبيانات مع تقارير سحابية</p>
        </header>

         <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-tachometer-alt"></i> نظرة عامة لليوم (<span id="today-date-display"></span>)</h2>
            </div>
            <div id="overview-grid" class="grid-container">
                <div class="stat-card success"><i class="fas fa-user-check"></i><div><span class="stat-value" id="present-count">0</span><span class="stat-label">حاضر</span></div></div>
                <div class="stat-card danger"><i class="fas fa-user-times"></i><div><span class="stat-value" id="absent-count">0</span><span class="stat-label">غائب</span></div></div>
                <div class="stat-card info"><i class="fas fa-question-circle"></i><div><span class="stat-value" id="unmarked-count">0</span><span class="stat-label">لم يسجل</span></div></div>
                <div class="stat-card primary"><i class="fas fa-users"></i><div><span class="stat-value" id="total-employees-count">0</span><span class="stat-label">إجمالي العمال</span></div></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-users"></i> قائمة العمال</h2>
                <button id="add-employee-btn" class="btn primary"><i class="fas fa-user-plus"></i> <span>إضافة عامل</span></button>
            </div>
            <input type="text" id="search-input" placeholder="البحث يقوم بتصفية النتائج المحملة فقط..." style="margin-bottom: 15px;">
            <div class="table-wrapper" id="employees-table-wrapper">
                <table id="employees-table">
                    <thead><tr><th>الاسم</th><th>رقم الهاتف/التعريف</th><th>الحالة اليوم</th><th>إجراءات</th></tr></thead>
                    <tbody id="employees-table-body"></tbody>
                </table>
            </div>
            <div id="loader-container" style="text-align: center; padding: 20px;"></div>
        </div>
        </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, writeBatch, onSnapshot, limit, startAfter, getCountFromServer } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
    // ADDED: Import functions for pagination (limit, startAfter) and getCountFromServer

    const firebaseConfig = { /* Your Firebase Config */ };

    let db;
    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
    } catch(e) { /* Error handling */ }

    // --- DOM Elements ---
    const DOMElements = {
        employeesTableBody: document.getElementById('employees-table-body'),
        loaderContainer: document.getElementById('loader-container'),
        employeesTableWrapper: document.getElementById('employees-table-wrapper'),
        // ... other elements
    };

    // --- State for Pagination ---
    let lastVisibleEmployee = null; // Stores the last document snapshot for the next query
    let isLoading = false; // Prevents multiple simultaneous loads
    const EMPLOYEES_PER_PAGE = 50; // Load 50 employees at a time

    // ### HIGH-SPEED EMPLOYEE LOADING (PAGINATION) ###
    async function loadMoreEmployees() {
        if (isLoading) return;
        isLoading = true;
        showLoader();

        try {
            // Base query ordered by name
            const baseQuery = collection(db, 'employees');
            const orderedQuery = orderBy('name');
            
            let q;
            if (lastVisibleEmployee) {
                // If we have a last visible employee, start the next query after it
                q = query(baseQuery, orderedQuery, startAfter(lastVisibleEmployee), limit(EMPLOYEES_PER_PAGE));
            } else {
                // First load
                q = query(baseQuery, orderedQuery, limit(EMPLOYEES_PER_PAGE));
            }

            const documentSnapshots = await getDocs(q);

            if (documentSnapshots.empty) {
                // No more employees to load
                hideLoader(true);
            } else {
                documentSnapshots.forEach(doc => {
                    const empData = { id: doc.id, ...doc.data() };
                    // Add employee row to the table (using your existing function)
                    addEmployeeRow(empData); 
                });
                
                // Update the last visible document
                lastVisibleEmployee = documentSnapshots.docs[documentSnapshots.docs.length - 1];
                hideLoader(false);
            }
        } catch (error) {
            console.error("Error loading more employees:", error);
            showToast("خطأ في تحميل المزيد من العمال", "error");
        } finally {
            isLoading = false;
        }
    }

    function showLoader() {
        DOMElements.loaderContainer.innerHTML = '<div class="spinner"></div>';
    }

    function hideLoader(isEndOfList) {
        if (isEndOfList) {
            DOMElements.loaderContainer.innerHTML = '<p class="no-data">لقد وصلت إلى نهاية القائمة.</p>';
        } else {
            DOMElements.loaderContainer.innerHTML = '';
        }
    }

    // --- Intersection Observer to detect when user scrolls to the bottom ---
    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
            loadMoreEmployees();
        }
    }, { threshold: 1.0 });

    // --- Initial App Load ---
    function initApp() {
        // ... (setup other things like theme, dates)

        // Clear previous state and start fresh
        DOMElements.employeesTableBody.innerHTML = '';
        lastVisibleEmployee = null;
        
        // Start observing the loader container to trigger loading more
        observer.observe(DOMElements.loaderContainer);
        
        // Load initial batch of employees
        loadMoreEmployees();

        // Listen for total employee count for the dashboard
        updateTotalEmployeeCount();

        // Listen for daily attendance (this can remain as is, it's efficient for a single day)
        listenForAttendanceChanges(); 
    }

    async function updateTotalEmployeeCount() {
        const coll = collection(db, "employees");
        const snapshot = await getCountFromServer(coll);
        const totalCount = snapshot.data().count;
        // Update the dashboard card for total employees
        document.getElementById('total-employees-count').textContent = totalCount;
    }


    // --- NOTE on Searching ---
    // The search input will now only filter the currently loaded employees.
    // For a global search, you would need to use a dedicated search service like Algolia or perform a new query,
    // which is a more complex implementation.

    // Start the app
    if (db) {
        // setupEventListeners(); // Make sure this doesn't conflict
        initApp();
    }
    
    // All other functions (saveEmployee, generateReport, etc.) remain the same as the previous optimized version.
    // You would integrate this new loading logic into the existing full file.

</script>
</body>
</html>
