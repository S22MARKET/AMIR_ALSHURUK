<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفوظات الفواتير - مؤسسة صالحي سليم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-color: #005a9c;
            --primary-light: #eaf2f8;
            --danger-color: #dc3545;
            --success-color: #28a745;
            --info-color: #17a2b8;
        }
        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background-color: #f7f9fc;
        }
        .action-btn {
            padding: 0.75rem 1.5rem;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
        }
        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .custom-select {
            position: relative;
        }
        .custom-select::after {
            content: '▼';
            font-size: 0.8rem;
            color: #6c757d;
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="page-container container mx-auto p-4 md:p-6">
    <header class="page-header flex flex-wrap justify-between items-center gap-6 pb-6 mb-6 border-b-2" style="border-color: var(--primary-color);">
        <h1 class="text-2xl md:text-3xl font-bold" style="color: var(--primary-color);">محفوظات الفواتير</h1>
        <a href="invoice.html" class="action-btn" style="background-color: var(--primary-color);">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg>
            إنشاء فاتورة جديدة
        </a>
    </header>

    <div class="controls-container flex flex-col gap-6 mb-8">
        <div class="main-controls flex flex-col md:flex-row gap-4 items-center">
            <input type="text" id="search-box" placeholder="🔎 ابحث بالاسم أو الرقم..." class="p-3 border border-gray-300 rounded-lg flex-grow w-full md:w-auto transition-shadow focus:shadow-md focus:border-blue-500 outline-none">
            <div class="custom-select w-full md:w-auto">
                <select id="sort-by" class="appearance-none p-3 border border-gray-300 rounded-lg bg-white cursor-pointer w-full md:w-52">
                    <option value="newest">فرز حسب: الأحدث أولاً</option>
                    <option value="oldest">فرز حسب: الأقدم أولاً</option>
                    <option value="highest">فرز حسب: الأعلى مبلغاً</option>
                    <option value="lowest">فرز حسب: الأقل مبلغاً</option>
                </select>
            </div>
        </div>
        <div class="secondary-controls flex flex-wrap gap-4">
            <button id="import-btn" class="action-btn" style="background-color: var(--success-color);">📂 استيراد ملف</button>
            <button id="export-btn" class="action-btn" style="background-color: var(--info-color);">💾 تصدير كملف</button>
            <button id="delete-all-btn" class="action-btn" style="background-color: var(--danger-color);">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>
                حذف الكل
            </button>
            <input type="file" id="import-file-input" accept=".json" class="hidden">
        </div>
    </div>
    
    <div class="summary-stats p-4 rounded-lg flex flex-wrap justify-around gap-4 text-center mb-8" id="summary-stats" style="background-color: var(--primary-light);"></div>

    <main>
        <div id="invoices-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>
</div>

<!-- Firebase SDK -->
<script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, deleteDoc, writeBatch, query as firestoreQuery, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- START: Configuration and Initialization ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "YOUR_API_KEY", authDomain: "YOUR_AUTH_DOMAIN", projectId: "YOUR_PROJECT_ID" };
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userId = null;
    let allInvoices = [];
    let unsubscribe = null; // To hold the listener cleanup function

    // --- END: Configuration and Initialization ---

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            userId = user.uid;
            console.log("User is authenticated with UID:", userId);
            // If there's an active listener, stop it before starting a new one
            if (unsubscribe) unsubscribe();
            listenForInvoices();
        } else {
            console.log("No user signed in, attempting to sign in.");
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Error during sign-in:", error);
            }
        }
    });

    const listContainer = document.getElementById('invoices-list');
    const searchBox = document.getElementById('search-box');
    const sortBy = document.getElementById('sort-by');
    const summaryContainer = document.getElementById('summary-stats');
    const importFileInput = document.getElementById('import-file-input');

    const formatCurrency = (num) => (num || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const renderSummary = (invoices) => {
        const totalAmount = invoices.reduce((sum, inv) => sum + (inv.totalTTC || 0), 0);
        const invoiceCount = invoices.length;
        
        summaryContainer.innerHTML = `
            <div class="stat text-blue-800">
                <span class="block text-sm">إجمالي عدد الفواتير</span>
                <strong class="block text-2xl font-bold text-gray-800">${invoiceCount}</strong>
            </div>
            <div class="stat text-blue-800">
                <span class="block text-sm">المبلغ الإجمالي للفواتير (TTC)</span>
                <strong class="block text-2xl font-bold text-gray-800">${formatCurrency(totalAmount)} دج</strong>
            </div>
        `;
    };

    const renderInvoices = (invoicesToRender) => {
        listContainer.innerHTML = '';
        
        if (allInvoices.length === 0) {
            listContainer.innerHTML = createMessageHTML('no-invoices');
            return;
        }
        if (invoicesToRender.length === 0) {
            listContainer.innerHTML = createMessageHTML('no-results');
            return;
        }

        invoicesToRender.forEach(invoice => {
            const card = document.createElement('div');
            card.className = 'invoice-card bg-white rounded-lg p-5 shadow-md transition-transform transform hover:-translate-y-1';
            card.style.borderRight = `5px solid ${invoice.options?.themeColor || 'var(--primary-color)'}`;
            card.dataset.id = invoice.id;
            card.innerHTML = createInvoiceCardHTML(invoice);
            listContainer.appendChild(card);
        });
    };
    
    const createMessageHTML = (type) => {
        const messages = {
            'no-invoices': {
                icon: `<svg class="w-16 h-16 mx-auto mb-6 opacity-50" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16"><path d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h13zM1 3.5a.5.5 0 0 0 0 1h14a.5.5 0 0 0 0-1H1zm0 3a.5.5 0 0 0 0 1h14a.5.5 0 0 0 0-1H1zm0 3a.5.5 0 0 0 0 1h14a.5.5 0 0 0 0-1H1z"/></svg>`,
                title: 'لا توجد فواتير محفوظة',
                text: 'ليس لديك أي فواتير حاليًا. انقر على زر "إنشاء فاتورة جديدة" للبدء.'
            },
            'no-results': {
                icon: `<svg class="w-16 h-16 mx-auto mb-6 opacity-50" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>`,
                title: 'لا توجد نتائج مطابقة',
                text: 'لم يتم العثور على فواتير تطابق بحثك. حاول استخدام كلمات أخرى.'
            }
        };
        const msg = messages[type];
        return `<div class="message-container text-center p-12 bg-gray-100 border-2 border-dashed border-gray-300 rounded-lg text-gray-500 col-span-full">${msg.icon}<h2 class="text-xl font-bold text-gray-800 mb-2">${msg.title}</h2><p>${msg.text}</p></div>`;
    };

    const createInvoiceCardHTML = (invoice) => `
        <div class="card-header font-bold text-lg text-gray-800 mb-4">
            <span class="invoice-num" style="color: ${invoice.options?.themeColor || 'var(--primary-color)'};">فاتورة رقم: ${invoice.invoiceNum || 'N/A'}</span>
        </div>
        <div class="card-body flex-grow flex flex-col gap-2 text-sm">
            <p class="text-gray-600"><strong class="text-gray-800 font-semibold ml-2">العميل:</strong> ${invoice.clientName || 'غير محدد'}</p>
            <p class="text-gray-600"><strong class="text-gray-800 font-semibold ml-2">التاريخ:</strong> ${invoice.invoiceDate || 'غير محدد'}</p>
            <p class="text-gray-600 font-bold mt-2"><strong class="text-gray-800 font-semibold ml-2">الإجمالي (TTC):</strong> ${formatCurrency(invoice.totalTTC)} دج</p>
        </div>
        <div class="card-footer mt-6 pt-4 border-t border-gray-200 grid grid-cols-2 gap-3">
            <button class="action-btn col-span-2" data-action="view" style="background-color: var(--primary-color);">عرض وتعديل</button>
            <button class="action-btn" data-action="delete" style="background-color: var(--danger-color);">حذف</button>
        </div>
    `;

    function listenForInvoices() {
        if (!userId) return;
        const invoicesCollectionPath = `/artifacts/${appId}/public/data/invoices`;
        const invoicesRef = collection(db, invoicesCollectionPath);
        const q = firestoreQuery(invoicesRef, orderBy("lastUpdatedAt", "desc"));

        unsubscribe = onSnapshot(q, (snapshot) => {
            allInvoices = snapshot.docs
                .map(doc => ({ id: doc.id, ...doc.data() }))
                .filter(doc => doc.id !== 'draft'); // Ensure draft is excluded
            updateDisplay();
        }, (error) => {
            console.error("Error listening for invoice changes:", error);
            alert("حدث خطأ في جلب الفواتير.");
        });
    }

    const updateDisplay = () => {
        const query = searchBox.value.toLowerCase().trim();
        let filtered = allInvoices;

        if (query) {
            filtered = allInvoices.filter(invoice => 
                (invoice.clientName || '').toLowerCase().includes(query) || 
                (invoice.invoiceNum || '').toLowerCase().includes(query)
            );
        }

        const sortValue = sortBy.value;
        filtered.sort((a, b) => {
            switch (sortValue) {
                case 'oldest': return (a.lastUpdatedAt?.toDate() || 0) - (b.lastUpdatedAt?.toDate() || 0);
                case 'highest': return (b.totalTTC || 0) - (a.totalTTC || 0);
                case 'lowest': return (a.totalTTC || 0) - (b.totalTTC || 0);
                case 'newest':
                default:
                    return (b.lastUpdatedAt?.toDate() || 0) - (a.lastUpdatedAt?.toDate() || 0);
            }
        });

        renderInvoices(filtered);
        renderSummary(allInvoices);
    };

    const handleCardAction = async (e) => {
        const button = e.target.closest('.action-btn');
        if (!button || !userId) return;

        const card = button.closest('.invoice-card');
        const docId = card?.dataset.id;
        const invoice = allInvoices.find(inv => inv.id === docId);
        if (!invoice) return;

        const action = button.dataset.action;

        if (action === 'view') {
            sessionStorage.setItem('invoiceToLoad', JSON.stringify(invoice));
            window.location.href = 'invoice.html';
        } else if (action === 'delete') {
            if (confirm(`هل أنت متأكد من حذف فاتورة العميل "${invoice.clientName}"؟`)) {
                try {
                    const docRef = doc(db, `/artifacts/${appId}/public/data/invoices`, docId);
                    await deleteDoc(docRef);
                    console.log("Invoice deleted successfully");
                    // UI will update automatically via onSnapshot
                } catch (error) {
                    console.error("Error deleting invoice:", error);
                    alert("حدث خطأ أثناء حذف الفاتورة.");
                }
            }
        }
    };
    
    const handleExport = () => {
        if (allInvoices.length === 0) {
            alert('لا توجد فواتير محفوظة لتصديرها.');
            return;
        }
        const dataStr = JSON.stringify(allInvoices, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `invoices-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('تم تصدير الملف بنجاح! احتفظ به في مكان آمن.');
    };

    const handleImport = (event) => {
        if (!userId) {
            alert("يجب تسجيل الدخول أولاً للاستيراد.");
            return;
        }
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const importedInvoices = JSON.parse(e.target.result);
                if (!Array.isArray(importedInvoices)) throw new Error('الملف غير صالح.');
                
                const confirmationMsg = `هل أنت متأكد من استيراد ${importedInvoices.length} فاتورة؟ سيتم دمجها مع الفواتير الحالية.`;
                if (confirm(confirmationMsg)) {
                    const batch = writeBatch(db);
                    const collectionRef = collection(db, `/artifacts/${appId}/public/data/invoices`);
                    
                    importedInvoices.forEach(inv => {
                        const docRef = doc(collectionRef); // Create a new doc with a new ID
                        // Remove id from object if it exists to let firestore generate it
                        delete inv.id;
                        batch.set(docRef, inv);
                    });
                    
                    await batch.commit();
                    alert(`تم استيراد ${importedInvoices.length} فاتورة جديدة بنجاح!`);
                }
            } catch (error) {
                console.error("Import failed:", error);
                alert('فشل استيراد الملف. يرجى التأكد من أنه ملف تصدير صالح.');
            } finally {
                event.target.value = null; 
            }
        };
        reader.readAsText(file);
    };

    const handleDeleteAll = async () => {
        if (!userId || allInvoices.length === 0) {
            alert("لا توجد فواتير لحذفها.");
            return;
        }
        if (confirm("تحذير! هل أنت متأكد من حذف جميع الفواتير؟ لا يمكن التراجع عن هذا الإجراء.")) {
            try {
                const batch = writeBatch(db);
                allInvoices.forEach(inv => {
                    const docRef = doc(db, `/artifacts/${appId}/public/data/invoices`, inv.id);
                    batch.delete(docRef);
                });
                await batch.commit();
                alert("تم حذف جميع الفواتير بنجاح.");
            } catch (error) {
                console.error("Error deleting all invoices:", error);
                alert("حدث خطأ أثناء حذف جميع الفواتير.");
            }
        }
    };

    // --- INITIALIZATION ---
    searchBox.addEventListener('input', updateDisplay);
    sortBy.addEventListener('change', updateDisplay);
    listContainer.addEventListener('click', handleCardAction);
    document.getElementById('export-btn').addEventListener('click', handleExport);
    document.getElementById('import-btn').addEventListener('click', () => importFileInput.click());
    importFileInput.addEventListener('change', handleImport);
    document.getElementById('delete-all-btn').addEventListener('click', handleDeleteAll);
</script>

</body>
</html>
