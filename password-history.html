<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل كلمات المرور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50; --secondary-color: #3498db; --background-gradient-start: #f4f7f9;
            --background-gradient-end: #e9eef2; --card-bg: #ffffff; --text-color: #333333;
            --border-color: #e0e0e0; --shadow-color: rgba(44, 62, 80, 0.1); --error-color: #e74c3c;
        }
        body.dark-mode {
            --primary-color: #ecf0f1; --background-gradient-start: #1a202c; --background-gradient-end: #2d3748;
            --card-bg: #4a5568; --text-color: #f7fafc; --border-color: #4a5568;
        }
        body {
            font-family: 'Tajawal', sans-serif; background-image: linear-gradient(135deg, var(--background-gradient-start), var(--background-gradient-end));
            color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .container { max-width: 800px; width: 100%; margin: 0 auto; background-color: var(--card-bg); border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px var(--shadow-color); }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 30px; }
        .history-table { width: 100%; border-collapse: collapse; }
        .history-table th, .history-table td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border-color); }
        .history-table th { font-weight: 700; }
        .status-current { color: #27ae60; font-weight: bold; }
        .status-old { color: #e74c3c; }
        .back-link { display: block; text-align: center; margin-top: 30px; padding: 12px; background-color: var(--secondary-color); color: white; text-decoration: none; border-radius: 10px; font-weight: bold; }
        #history-section { display: none; } /* Hidden by default */
        /* Login Form Styles */
        .login-form input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); font-family: 'Tajawal', sans-serif; font-size: 1rem; margin-bottom: 15px; }
        .login-form button { width: 100%; padding: 12px; border-radius: 8px; background-color: var(--secondary-color); color: white; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; }
        #error-message { color: var(--error-color); text-align: center; margin-top: 10px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-section">
            <h1>الوصول مطلوب</h1>
            <p style="text-align: center; margin-bottom: 20px;">الرجاء إدخال كلمة المرور الرئيسية للوحة التحكم.</p>
            <form id="login-form" class="login-form">
                <input type="password" id="password-input" placeholder="كلمة المرور" required>
                <button type="submit">دخول</button>
                <p id="error-message"></p>
            </form>
            <a href="dashboredsalim.html" class="back-link" style="background-color: #7f8c8d;">العودة إلى لوحة التحكم</a>
        </div>

        <div id="history-section">
            <h1>سجل كلمات المرور</h1>
            <div id="history-container">
                <table class="history-table">
                    <thead><tr><th>كلمة المرور</th><th>الحالة</th><th>تاريخ الإنشاء</th></tr></thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
            <a href="dashboredsalim.html" class="back-link">العودة إلى لوحة التحكم</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); }

            const loginSection = document.getElementById('login-section');
            const historySection = document.getElementById('history-section');
            const loginForm = document.getElementById('login-form');
            const passwordInput = document.getElementById('password-input');
            const errorMessage = document.getElementById('error-message');

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const correctPassword = localStorage.getItem('dashboardPassword');

                if (passwordInput.value === correctPassword) {
                    loginSection.style.display = 'none';
                    historySection.style.display = 'block';
                    displayHistory();
                } else {
                    errorMessage.textContent = 'كلمة المرور غير صحيحة.';
                }
            });

            function displayHistory() {
                const historyBody = document.getElementById('history-body');
                const history = JSON.parse(localStorage.getItem('passwordHistory')) || [];
                if (history.length === 0) {
                    historyBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">لا يوجد سجل لعرضه.</td></tr>';
                    return;
                }
                history.sort((a, b) => new Date(b.date) - new Date(a.date));
                history.forEach(item => {
                    const row = document.createElement('tr');
                    const date = new Date(item.date).toLocaleString('ar-DZ');
                    const statusClass = item.status === 'Current' ? 'status-current' : 'status-old';
                    const statusText = item.status === 'Current' ? 'حالي' : 'قديم';
                    row.innerHTML = `<td>${item.password}</td><td class="${statusClass}">${statusText}</td><td>${date}</td>`;
                    historyBody.appendChild(row);
                });
            }
        });
    </script>
</body>
</html>
